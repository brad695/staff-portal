<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03192a">
<meta name="robots" content="noindex">
<title>Greys Chat</title>
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/chat-manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Greys Chat">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: Slack's 2023 shell — dark rail + top bar framing a rounded client (sidebar | messages | right pane), recolored GREYS navy */
:root{
  --rail:#03192a; --side:#06273a; --side-hover:#0f3b57; --side-active:#2b78b0; --side-text:rgba(226,236,243,.74); --side-line:rgba(255,255,255,.12);
  --bg:#ffffff; --fg:#1d1c1d; --muted:#616061; --faint:#9a9a9b; --line:#dddddd; --line-soft:#ebebeb; --hover:#f8f8f8; --soft:#f6f7f8;
  --link:#1264a3; --mention-bg:#e8f5fa; --mention-fg:#1264a3; --rx:#efefef; --rx-mine:#e8f5fa; --rx-mine-br:#1d9bd1;
  --badge:#e01e5a; --online:#2bac76; --send:#007a5a; --flag:#fef9ed; --note:#fff6d8; --note-br:#e8c454; --gold:#e6b33c;
  --cbr:#bbbabb; --shadow:0 0 0 1px rgba(29,28,29,.13),0 4px 12px rgba(0,0,0,.12); --overlay:rgba(0,0,0,.45);
  --code-bg:#f8f8f8; --code-fg:#e01e5a; --menu-hi:#1264a3; --flash:#fff3c4;
  --font:'Lato','Slack-Lato',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:Monaco,Menlo,Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --rail:#020f19; --side:#06273a; --side-hover:#0f3b57; --side-active:#2b78b0;
  --bg:#1a1d21; --fg:#d1d2d3; --muted:#ababad; --faint:#7a7c80; --line:#35373b; --line-soft:#2c2e33; --hover:#222529; --soft:#222529;
  --link:#1d9bd1; --mention-bg:rgba(29,155,209,.14); --mention-fg:#36c5f0; --rx:#2c2e33; --rx-mine:rgba(29,155,209,.18); --rx-mine-br:#1d9bd1;
  --flag:rgba(242,199,68,.08); --note:rgba(232,196,84,.13); --note-br:#b8932a; --cbr:#565856; --shadow:0 0 0 1px rgba(255,255,255,.1),0 4px 12px rgba(0,0,0,.5);
  --overlay:rgba(0,0,0,.65); --code-bg:#232529; --code-fg:#e8912d; --menu-hi:#1164a3; --flash:rgba(242,199,68,.22); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --rail:#020f19; --side:#06273a; --side-hover:#0f3b57; --side-active:#2b78b0;
  --bg:#1a1d21; --fg:#d1d2d3; --muted:#ababad; --faint:#7a7c80; --line:#35373b; --line-soft:#2c2e33; --hover:#222529; --soft:#222529;
  --link:#1d9bd1; --mention-bg:rgba(29,155,209,.14); --mention-fg:#36c5f0; --rx:#2c2e33; --rx-mine:rgba(29,155,209,.18); --rx-mine-br:#1d9bd1;
  --flag:rgba(242,199,68,.08); --note:rgba(232,196,84,.13); --note-br:#b8932a; --cbr:#565856; --shadow:0 0 0 1px rgba(255,255,255,.1),0 4px 12px rgba(0,0,0,.5);
  --overlay:rgba(0,0,0,.65); --code-bg:#232529; --code-fg:#e8912d; --menu-hi:#1164a3; --flash:rgba(242,199,68,.22); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--rail);color:var(--fg);font:15px/1.46668 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:2px solid #1d9bd1;outline-offset:1px}

#app{height:100%;display:grid;grid-template-columns:70px minmax(0,1fr);grid-template-rows:40px minmax(0,1fr)}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px 0 82px;color:#fff}
.top .hist{display:flex;gap:2px;width:248px;flex:none}
.top .hist button{width:28px;height:26px;border-radius:6px;display:grid;place-items:center;color:rgba(255,255,255,.75)}
.top .hist button:hover{background:rgba(255,255,255,.12)}
.search{flex:1;max-width:732px;margin:0 auto;position:relative}
.search input{width:100%;height:26px;border-radius:6px;border:0;background:rgba(255,255,255,.16);color:#fff;padding:0 30px 0 32px;font-size:13px}
.search input::placeholder{color:rgba(255,255,255,.8)}
.search input:focus{background:var(--bg);color:var(--fg);outline:0;box-shadow:var(--shadow)}
.search input:focus::placeholder{color:var(--muted)}
.search .si{position:absolute;left:9px;top:5px;color:rgba(255,255,255,.85);pointer-events:none}
.search input:focus ~ .si{color:var(--muted)}
.top .help{width:28px;height:26px;border-radius:6px;display:grid;place-items:center;margin-left:auto;color:rgba(255,255,255,.8);flex:none}
.top .help:hover{background:rgba(255,255,255,.12)}
.demo-pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:rgba(230,179,60,.18);color:var(--gold);flex:none}

/* rail */
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 14px;color:#fff;min-height:0}
.ws-tile{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--side);font-weight:900;font-size:17px;display:grid;place-items:center;margin-bottom:10px;box-shadow:0 0 0 2px var(--rail),0 0 0 4px rgba(255,255,255,.55)}
.r-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:rgba(255,255,255,.88);position:relative}
.r-btn .ri{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;transition:background .12s}
.r-btn:hover .ri{background:rgba(255,255,255,.14)}
.r-btn.on .ri{background:rgba(255,255,255,.24)}
.r-btn .ri{position:relative}
.r-btn .dot{position:absolute;top:-6px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:var(--badge);font-size:11px;line-height:18px;padding:0 5px;border:2px solid var(--rail);box-sizing:content-box}
.rail .spacer{flex:1}
.r-plus{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.r-me{position:relative;margin-top:6px}

/* client shell */
.client{grid-column:2;grid-row:2;margin:0 4px 4px 0;border-radius:8px;overflow:hidden;display:grid;grid-template-columns:260px minmax(0,1fr) auto;background:var(--bg);min-height:0}
/* sidebar */
.side{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--side-line)}
.ws-head{height:49px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px}
.ws-name{font-weight:900;font-size:18px;color:#fff;display:flex;align-items:center;gap:4px;border-radius:6px;padding:2px 6px;margin-left:-6px;white-space:nowrap;min-width:0}
.ws-name span{overflow:hidden;text-overflow:ellipsis}
.ws-name:hover{background:var(--side-hover)}
.ws-tools{display:flex;gap:4px}
.ws-tools button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff}
.ws-tools button:hover{background:var(--side-hover)}
.ws-tools .compose{background:rgba(255,255,255,.95);color:var(--side)}
.ws-tools .compose:hover{background:#fff}
.side-scroll{flex:1;overflow-y:auto;padding:4px 0 16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.s-item{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 16px;margin:0 8px;border-radius:6px;font-size:15px;cursor:pointer;white-space:nowrap;min-width:0;width:calc(100% - 16px);text-align:left}
.s-item:hover{background:var(--side-hover)}
.s-item .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.s-item.unread{color:#fff;font-weight:900}
.s-item.muted{opacity:.55}
.s-item.active{background:var(--side-active);color:#fff}
.s-item .ico{width:20px;display:grid;place-items:center;opacity:.9}
.s-item .meta{font-size:12px;opacity:.7;font-weight:400}
.badge{margin-left:auto;background:var(--badge);color:#fff;font-size:12px;font-weight:700;border-radius:9px;padding:0 7px;height:18px;line-height:18px;flex:none}
.sec{margin-top:10px}
.sec-head{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px;margin:0 8px;border-radius:6px;font-size:15px;cursor:pointer;width:calc(100% - 16px)}
.sec-head:hover{background:var(--side-hover)}
.sec-head .car{transition:transform .15s;width:20px;display:grid;place-items:center}
.sec.closed .car{transform:rotate(-90deg)}
.sec-head .add{margin-left:auto;width:24px;height:24px;border-radius:6px;display:none;place-items:center}
.sec-head:hover .add{display:grid}
.sec-head .add:hover{background:rgba(255,255,255,.14)}
.sec.closed .s-item:not(.unread):not(.active){display:none}
.s-add{color:var(--side-text)}
.s-add .ico{background:rgba(255,255,255,.12);border-radius:4px;width:20px;height:20px}
.mini-av{position:relative;width:20px;height:20px;flex:none}
.mini-av .av{width:20px;height:20px;border-radius:4px;font-size:10px}
.pres{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--side);background:var(--side)}
.pres.on{background:var(--online)}
.pres.away::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--side-text)}
.pres.big{width:14px;height:14px;border-width:3px}
.grp-n{width:20px;height:20px;border-radius:4px;background:rgba(255,255,255,.18);font-size:11px;font-weight:700;display:grid;place-items:center;color:#fff}
.huddle-card{margin:8px;border-radius:10px;background:#0b3550;color:#fff;padding:10px 12px;display:none;flex-direction:column;gap:8px}
.huddle-card.on{display:flex}
.huddle-card .h-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.huddle-card .live{width:8px;height:8px;border-radius:50%;background:var(--online);box-shadow:0 0 0 3px rgba(43,172,118,.3);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(43,172,118,0)}}
.huddle-card .h-avs{display:flex;gap:4px}
.huddle-card .h-btns{display:flex;gap:6px}
.huddle-card .h-btns button{height:30px;border-radius:8px;padding:0 10px;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.huddle-card .h-btns .leave{background:#e01e5a;margin-left:auto}
.side-foot{padding:6px 16px 10px;font-size:12px;color:rgba(255,255,255,.45)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.ch-head{height:49px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 16px;min-width:0}
.ch-title{display:flex;align-items:center;gap:4px;font-weight:900;font-size:18px;padding:3px 8px;border-radius:6px;min-width:0;white-space:nowrap}
.ch-title:hover{background:var(--hover)}
.ch-title span{overflow:hidden;text-overflow:ellipsis}
.ch-star{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.ch-star.on{color:var(--gold)}
.ch-star:hover{background:var(--hover)}
.ch-head .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.mem-btn{display:flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 3px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.mem-btn:hover{background:var(--hover)}
.stack{display:flex}
.stack .av{width:20px;height:20px;font-size:9px;border-radius:5px;box-shadow:0 0 0 2px var(--bg)}
.stack .av+.av{margin-left:-5px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.huddle-btn{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.huddle-btn:hover{background:var(--hover)}
.huddle-btn.on{background:var(--online);border-color:var(--online);color:#fff}
.back-btn{display:none}
.tabs{flex:none;display:flex;align-items:flex-end;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);height:38px;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--side-active)}
.tab .n{font-weight:400;color:var(--faint)}
.bm-bar{flex:none;display:flex;align-items:center;gap:4px;padding:4px 16px;border-bottom:1px solid var(--line);font-size:13px;overflow-x:auto;scrollbar-width:none;min-height:34px}
.bm{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;color:var(--fg);white-space:nowrap;text-decoration:none}
.bm:hover{background:var(--hover)}
.bm.add{color:var(--muted)}
.client-strip{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.client-strip b{color:var(--fg)}
.client-strip .ct{display:inline-flex;align-items:center;gap:5px}
.tagpill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;background:var(--mention-bg);color:var(--mention-fg);font-weight:700;font-size:12px}
.portal-link{margin-left:auto;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line);font-weight:700;color:var(--fg)}
.portal-link:hover{background:var(--hover)}

.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:12px;min-height:0}
.intro{padding:40px 20px 16px}
.intro h2{margin:0 0 6px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px}
.intro p{margin:0 0 14px;color:var(--muted);font-size:15px;max-width:60ch}
.intro .big-av .av{width:72px;height:72px;border-radius:12px;font-size:28px}
.intro .btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--cbr);font-weight:700;font-size:15px;background:var(--bg)}
.btn:hover{background:var(--hover)}
.btn.sm{height:28px;font-size:13px;padding:0 10px}
.btn.primary{background:var(--send);border-color:var(--send);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--send)}
.btn.blue{background:var(--side);border-color:var(--side);color:#fff}
.btn.danger{background:#e01e5a;border-color:#e01e5a;color:#fff}
.btn:disabled{opacity:.45;cursor:default}

.day{position:sticky;top:0;z-index:2;display:flex;justify-content:center;height:28px;margin:20px 0 4px;pointer-events:none}
.day::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.day span{position:relative;pointer-events:auto;height:28px;line-height:26px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:13px;font-weight:700;cursor:pointer}
.day span:hover{background:var(--hover)}
.newdiv{position:relative;height:1px;background:var(--badge);margin:10px 0 6px}
.newdiv span{position:absolute;right:16px;top:-9px;background:var(--bg);color:var(--badge);font-size:12px;font-weight:700;padding:0 6px;line-height:18px}

.msg{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:8px;padding:8px 20px 6px}
.msg.cont{padding-top:2px;padding-bottom:2px}
.msg:hover,.msg.menu-open{background:var(--hover)}
.msg.flag{background:var(--flag)}
.msg.note{background:var(--note);box-shadow:inset 3px 0 0 var(--note-br)}
.msg.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,40%{background:var(--flash)}}
.m-lbl{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding-left:16px;margin-bottom:2px}
.m-lbl .pin{color:#e01e5a}
.m-lbl .sv{color:#e01e5a}
.m-left{padding-top:2px}
.g-time{display:block;font-size:12px;color:var(--muted);text-align:right;line-height:22px;visibility:hidden;white-space:nowrap;margin-left:-8px}
.msg:hover .g-time{visibility:visible}
.av{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;flex:none;text-transform:uppercase;user-select:none}
.av.bot{font-size:16px}
.m-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.3}
.m-name{font-weight:900;font-size:15px}
.m-name:hover{text-decoration:underline}
.m-status{font-size:13px}
.app,.ext{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--rx);color:var(--muted);letter-spacing:.03em;align-self:center}
.ext.sms{background:#e3f4ec;color:#0b6b46}
.ext.email{background:#e6eefb;color:#1d4ed8}
:root[data-theme="dark"] .ext.sms{background:rgba(43,172,118,.18);color:#5fd3a0}
:root[data-theme="dark"] .ext.email{background:rgba(29,155,209,.18);color:#6cc6ef}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ext.sms{background:rgba(43,172,118,.18);color:#5fd3a0}:root:not([data-theme="light"]) .ext.email{background:rgba(29,155,209,.18);color:#6cc6ef}}
.m-time{font-size:12px;color:var(--muted)}
.m-time:hover{text-decoration:underline;cursor:pointer}
.subj{font-weight:700;font-size:15px;margin-top:2px}
.m-body{font-size:15px;line-height:1.46668;overflow-wrap:anywhere;min-width:0}
.m-body b{font-weight:900}
.m-body a{color:var(--link);text-decoration:none}
.m-body a:hover{text-decoration:underline}
.m-body code{font-family:var(--mono);font-size:12px;color:var(--code-fg);background:var(--code-bg);border:1px solid var(--line);border-radius:3px;padding:2px 3px}
.m-body pre{font-family:var(--mono);font-size:12px;line-height:1.5;background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:8px;margin:4px 0;white-space:pre-wrap;overflow-x:auto}
.m-body blockquote{margin:2px 0;padding-left:12px;border-left:4px solid var(--line)}
.m-body ul,.m-body ol{margin:2px 0;padding-left:26px}
.mention{background:var(--mention-bg);color:var(--mention-fg);border-radius:3px;padding:0 2px;font-weight:400;cursor:pointer}
.mention.me{background:#fdf0c7;color:#1d1c1d}
:root[data-theme="dark"] .mention.me{background:rgba(242,199,68,.25);color:#f2c744}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mention.me{background:rgba(242,199,68,.25);color:#f2c744}}
.chlink{color:var(--link);cursor:pointer}
.chlink:hover{text-decoration:underline}
.edited{font-size:13px;color:var(--muted);margin-left:4px}
.deliv{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:2px}
.deliv .ok{color:var(--online)}
.card{margin-top:6px;border-left:4px solid var(--side-active);padding:2px 0 2px 12px;max-width:520px}
.card h4{margin:0 0 6px;font-size:15px;font-weight:900}
.card .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin-bottom:8px;font-size:14px}
.card .fields div b{display:block;font-size:13px;font-weight:900}
.fwd{margin-top:4px;border-left:4px solid var(--line);padding:2px 0 2px 12px}
.fwd .fh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900}
.fwd .fh .av{width:20px;height:20px;font-size:9px;border-radius:4px}
.fwd .ff{font-size:12px;color:var(--muted);margin-top:2px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

.joinbar b{display:block;font-size:17px;margin-bottom:4px}
.joinbar p{margin:0 0 12px;color:var(--muted)}
.deliv.bad{color:#e01e5a}
.msg.pending{opacity:.6}
.older{display:flex;justify-content:center;padding:10px}

body{display:flex;flex-direction:column}
#app{flex:1 1 auto;min-height:0;height:auto}
.nbar{flex:none;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 44px;background:var(--gold);color:#03192a;font-size:14px;line-height:1.35;text-align:center}

const SB_URL='https://vdvtrevhqalmjwhjhjug.supabase.co';
const SB_KEY='sb_publishable_LnlevWReed7K8cFk_f_Mxg_UywktQ5_';
const API=SB_URL+'/functions/v1/chat-api';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _id=1; const tmpId=()=>'tmp'+(_id++);
const MIN=60000, HOUR=60*MIN, DAY=24*HOUR;
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const time=ts=>new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
function dayLabel(ts){const d=new Date(ts),n=new Date();if(sameDay(ts,n))return'Today';if(sameDay(ts,n.getTime()-DAY))return'Yesterday';return d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})+(d.getFullYear()!==n.getFullYear()?', '+d.getFullYear():'');}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+(Math.floor(s/3600)===1?' hour ago':' hours ago');if(s<172800)return'yesterday';return Math.floor(s/86400)+' days ago';}
function shortWhen(ts){return sameDay(ts,Date.now())?time(ts):sameDay(ts,Date.now()-DAY)?'Yesterday':new Date(ts).toLocaleDateString([], {month:'short',day:'numeric'});}
const store={get(k,d){try{const v=localStorage.getItem('gc_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{if(v==null)localStorage.removeItem('gc_'+k);else localStorage.setItem('gc_'+k,JSON.stringify(v))}catch(e){}}};
const cap=s=>String(s||'').replace(/\b\w/g,c=>c.toUpperCase());

/* ---------- API ---------- */
let TOKEN=store.get('token',null);
async function api(a,body={}){
  let r,d;
  try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-chat-token':TOKEN||''},body:JSON.stringify({a,...body})});d=await r.json();}
  catch(e){throw new Error('Can\'t reach Greys Chat. Check your connection.');}
  if(r.status===401&&d&&d.signin){signOut();throw new Error(d.error);}
  if(!r.ok)throw new Error((d&&d.error)||'Something went wrong. Try again.');
  return d;
}
async function signOut(user){
  // signing out on purpose also stops this device's notifications for you
  if(user===true){try{const sub=await pushSub();if(sub){await api('push_unsub',{endpoint:sub.endpoint}).catch(()=>{});await sub.unsubscribe();}}catch(e){}}
  TOKEN=null;store.set('token',null);try{RT&&RT.unsubscribe();}catch(e){}location.reload();}
// chat.greyscheese.com/ and staff.greyscheese.com/chat.html both live at /chat.html (the app's home-screen + notification scope)
if(/^chat\./.test(location.hostname)&&/^\/(index\.html)?$/.test(location.pathname))history.replaceState(null,'','/chat.html'+location.search+location.hash);

/* ---------- notifications on this device ----------
   Real phone/computer notifications (Web Push): chat-sw.js shows them, the chat-notify edge function
   sends them when someone's away from chat. Android + computers: any modern browser. iPhone/iPad:
   only once Greys Chat is added to the Home Screen and opened from there (iOS 16.4+). */
const PUSH_SCOPE='/chat.html';
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const pushOK=()=>window.isSecureContext&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{let t=String(s).replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return Uint8Array.from(atob(t),c=>c.charCodeAt(0));};
let SWREG=null;
async function swReg(){
  if(SWREG)return SWREG;if(!pushOK())return null;
  const reg=await navigator.serviceWorker.register('/chat-sw.js',{scope:PUSH_SCOPE});
  if(!reg.active){const w=reg.installing||reg.waiting;if(w)await new Promise(r=>{const f=()=>{if(w.state==='activated'||w.state==='redundant'){w.removeEventListener('statechange',f);r();}};w.addEventListener('statechange',f);});}
  return SWREG=reg;}
async function pushSub(){try{const reg=SWREG||(pushOK()?await navigator.serviceWorker.getRegistration(PUSH_SCOPE):null);return reg?await reg.pushManager.getSubscription():null;}catch(e){return null;}}
async function pushSave(sub){await api('push_sub',{sub:sub.toJSON(),ua:navigator.userAgent.slice(0,200)});S.pushOn=true;}
/* every load: if this device already allows notifications, keep its subscription on file */
async function pushSync(){
  try{if(!pushOK()||Notification.permission!=='granted'||!S.vapid||store.get('pushOff',false)){S.pushOn=false;return;}
    const reg=await swReg();let sub=await reg.pushManager.getSubscription();
    try{if(sub&&sub.options&&sub.options.applicationServerKey&&b64u(sub.options.applicationServerKey)!==S.vapid){await sub.unsubscribe();sub=null;}}catch(e){}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:unb64u(S.vapid)});
    await pushSave(sub);
  }catch(e){S.pushOn=false;}finally{renderBanner();}}
/* from a tap: subscribe() asks for permission itself, so it must start inside the click (iPhone insists) */
async function pushOn(){
  if(!pushOK())throw new Error('This browser can\'t show notifications.');
  if(!S.vapid)throw new Error('Notifications aren\'t ready yet. Reload and try again.');
  if(S.swFail)throw new Error('Notifications aren\'t available on this site yet.');
  let reg=SWREG;
  if(!reg){if(Notification.permission==='default'&&await Notification.requestPermission()!=='granted')throw new Error('Notifications weren\'t allowed.');
    try{reg=await swReg();}catch(e){S.swFail=true;throw new Error('Notifications aren\'t available on this site yet.');}}
  const key=unb64u(S.vapid);let sub;
  try{sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});}
  catch(e){
    if(Notification.permission==='denied')throw new Error('Notifications are blocked for this site. Allow them in your browser\'s site settings.');
    const old=await reg.pushManager.getSubscription();if(!old||Notification.permission!=='granted')throw new Error('Notifications weren\'t turned on.');
    await old.unsubscribe();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});}
  store.set('pushOff',null);await pushSave(sub);renderBanner();
  return api('push_test',{endpoint:sub.endpoint}).catch(()=>({sent:0}));}
async function pushOff(){store.set('pushOff',true);const sub=await pushSub();if(sub){await api('push_unsub',{endpoint:sub.endpoint}).catch(()=>{});try{await sub.unsubscribe();}catch(e){}}S.pushOn=false;renderBanner();}
/* "I'm here": while a chat window is in front of someone (touched in the last 10 min) their phone stays quiet */
let lastInput=Date.now(),lastBeat=null;
const isActive=()=>document.visibilityState==='visible'&&Date.now()-lastInput<10*60000;
function beat(force){if(!ME||!TOKEN)return;const a=isActive();if(!force&&!a&&lastBeat===false)return;lastBeat=a;api('profile',{active:a}).catch(()=>{});}
['pointerdown','keydown','touchstart','wheel','mousemove'].forEach(t=>addEventListener(t,()=>{lastInput=Date.now();if(lastBeat===false&&document.visibilityState==='visible')beat(true);},{passive:true,capture:true}));
/* Slack-style strip at the top asking for permission (or, on an iPhone in Safari, to add to Home Screen) */
function renderBanner(){const el=$('#nbar');if(!el)return;let h='';
  if(ME&&!store.get('pushOff',false)&&Date.now()-store.get('nbarX',0)>7*DAY){
    if(isIOS&&!standalone())h='Get Greys Chat notifications on this phone: tap <b>Share</b>, then <b>Add to Home Screen</b>, and open Greys Chat from your Home Screen.';
    else if(SWREG&&S.vapid&&Notification.permission==='default')h='Greys Chat needs your permission to enable notifications. <button class="nbar-go" data-nb-on>Enable notifications</button>';}
  el.hidden=!h;el.innerHTML=h?`<span>${h}</span><button class="nbar-x" data-nb-x aria-label="Dismiss">${ic('x',16)}</button>`:'';
  const cn=$('#conn');if(cn)cn.style.top=h?(48+el.offsetHeight)+'px':'';}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-nb-x]')){store.set('nbarX',Date.now());renderBanner();return;}
  const b=e.target.closest('[data-nb-on]');if(b)busy(b,async()=>{const r=await pushOn();toast(r.sent?'Notifications are on. We sent a test to this device.':'Notifications are on for this device.');});});

if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};if(d.type==='open'&&ME)openFromNote(d.m,d.c);});try{navigator.serviceWorker.startMessages();}catch(e){}}

/* ---------- mapping from the server ---------- */
function mapPerson(p){
  const id=String(p.id);
  users[id]={name:p.name,title:p.title||[cap(p.role),cap(p.location)].filter(Boolean).join(' · '),color:p.color||PALETTE[p.id%PALETTE.length],
    away:!!p.away,status:(p.status_e||p.status_t)?{e:p.status_e||'💬',t:p.status_t||''}:null,email:p.email||'',loc:cap(p.location),role:p.role};
  Object.defineProperty(users[id],'presence',{get(){return ONLINE.has(id)&&!users[id].away?'active':'away';},configurable:true});
}
function mapConvo(c){
  const prev=convos[c.id];
  const o={id:c.id,type:c.kind,name:c.kind==='client'?(c.client_name||c.name):c.name,topic:c.topic||'',desc:c.description||'',private:c.is_private,
    members:(c.members||[]).map(String),bookmarks:c.bookmarks||[],created:Date.parse(c.created_at),creator:c.created_by?String(c.created_by):'bot',
    joined:!!c.me,lastRead:c.me?Date.parse(c.me.last_read_at):Infinity,muted:!!c.me?.muted,starred:!!c.me?.starred,archived:c.archived};
  if(prev&&prev.lastRead>o.lastRead)o.lastRead=prev.lastRead;
  if(c.kind==='client'){const u='k:'+c.id;o.client={u,via:c.client_via||'sms',phone:c.client_phone||'',email:c.client_email||'',tag:c.client_tag||'Client',meta:c.client_meta||''};
    users[u]={name:o.name,title:'Client'+(o.client.tag?' · '+o.client.tag:''),color:'#64748b',external:true,phone:prettyPhone(o.client.phone),email:o.client.email};}
  convos[c.id]=o; if(!msgs[c.id])msgs[c.id]=[];
  return o;
}
function prettyPhone(p){const m=String(p||'').match(/^\+1(\d{3})(\d{3})(\d{4})$/);return m?`(${m[1]}) ${m[2]}-${m[3]}`:(p||'');}
function mapMsg(r){
  const u=r.author_kind==='staff'?String(r.emp_id):r.author_kind==='client'?'k:'+r.convo_id:'bot';
  const rx={};Object.entries(r.rx||{}).forEach(([e,a])=>rx[e]=a.map(String));
  return {id:r.id,cid:r.convo_id,parent:r.parent_id||null,u,ts:Date.parse(r.created_at),html:r.body_html||'',rx,replies:[],
    files:(r.files||[]).map(f=>({name:f.name,size:f.size,kind:f.kind,url:f.url||f.ext||'',img:f.kind==='img'?(f.url||f.ext||''):null,path:f.path})),
    via:r.via||null,out:r.author_kind==='staff'&&!!r.via,status:r.status,error:r.error,note:r.is_note,subject:r.subject,
    card:r.card?{t:r.card.t,f:r.card.f||[],btn:r.card.btn,url:r.card.url}:null,
    fwd:r.fwd?{u:r.fwd.emp_id?String(r.fwd.emp_id):'bot',html:r.fwd.html,from:r.fwd.from,ts:Date.parse(r.fwd.ts)}:null,
    pinned:!!r.pinned_by,edited:!!r.edited_at,bcast:r.also_channel,deleted:!!r.deleted_at};
}
function upsertMsg(m){
  const old=byId[m.id];
  if(m.deleted){removeMsg(m.id);return;}
  if(old){m.replies=old.replies;Object.assign(old,m);return old;}
  byId[m.id]=m;
  if(m.parent){const p=byId[m.parent];if(p){p.replies.push(m);p.replies.sort((a,b)=>a.ts-b.ts);}else (ORPHANS[m.parent]=ORPHANS[m.parent]||[]).push(m);}
  else{const arr=msgs[m.cid]||(msgs[m.cid]=[]);
    let i=arr.length;while(i>0&&arr[i-1].ts>m.ts)i--;arr.splice(i,0,m);
    if(ORPHANS[m.id]){m.replies.push(...ORPHANS[m.id]);m.replies.sort((a,b)=>a.ts-b.ts);delete ORPHANS[m.id];}}
  return m;
}
const ORPHANS={};
function removeMsg(id){const m=byId[id];if(!m)return;delete byId[id];
  if(m.parent){const p=byId[m.parent];if(p)p.replies=p.replies.filter(x=>x.id!==id);}else msgs[m.cid]=(msgs[m.cid]||[]).filter(x=>x.id!==id);
  if(S.pane?.mid===id)S.pane=null;}

/* ---------- message formatting ---------- */
function userByHandle(h){h=h.toLowerCase();return STAFF.find(id=>users[id].name.toLowerCase().split(/\s+/)[0]===h)||STAFF.find(id=>users[id].name.toLowerCase().replace(/\s+/g,'')===h);}
function md(s){
  let h=esc(s); const blocks=[];
  h=h.replace(/```([\s\S]*?)```/g,(_,c)=>{blocks.push('<pre>'+c.replace(/^\n/,'')+'</pre>');return '\u0001'+(blocks.length-1)+'\u0001';});
  h=h.replace(/`([^`\n]+)`/g,(_,c)=>{blocks.push('<code>'+c+'</code>');return '\u0001'+(blocks.length-1)+'\u0001';});
  h=h.replace(/(https?:\/\/[^\s<]+|\b[a-z0-9-]+\.greyscheese\.com[^\s<]*)/gi,u=>{const href=/^https?:/i.test(u)?u:'https://'+u;blocks.push(`<a href="${href}" target="_blank" rel="noopener">${u}</a>`);return '\u0001'+(blocks.length-1)+'\u0001';});
  h=h.replace(/(^|[\s(>])\*([^*\n]+)\*(?=$|[\s.,!?)<])/g,'$1<b>$2</b>');
  h=h.replace(/(^|[\s(>])_([^_\n]+)_(?=$|[\s.,!?)<])/g,'$1<i>$2</i>');
  h=h.replace(/(^|[\s(>])~([^~\n]+)~(?=$|[\s.,!?)<])/g,'$1<s>$2</s>');
  h=h.replace(/(^|[\s(>])@([a-z]+)/gi,(m,p,id)=>{const k=id.toLowerCase();if(k==='here'||k==='channel'||k==='everyone')return `${p}<span class="mention bc" data-bc="1">@${k}</span>`;const u=userByHandle(k);if(u)return `${p}<span class="mention" data-uid="${u}">@${esc(users[u].name)}</span>`;return m;});
  h=h.replace(/(^|[\s(>])#([a-z0-9-_]+)/g,(m,p,n)=>{const c=Object.values(convos).find(c=>c.type==='channel'&&c.name===n);return c?`${p}<span class="chlink" data-go="${c.id}">#${n}</span>`:m;});
  h=h.replace(/(^|[\s(>]):([a-z0-9_+-]+):/g,(m,p,n)=>{const e=EMO_ALL.find(x=>x.n===n);return e?p+e.c:m;});
  h=h.split('\n').map(l=>l.startsWith('&gt; ')?'<blockquote>'+l.slice(5)+'</blockquote>':l).join('\n').replace(/\n/g,'<br>').replace(/<\/blockquote><br>/g,'</blockquote>');
  h=h.replace(/\u0001(\d+)\u0001/g,(_,i)=>blocks[i]);
  return h;
}

/* ---------- derived ---------- */
const nm=u=>users[u]?.name||'Former employee';
function cName(c){if(c.type==='channel'||c.type==='client')return c.name;const o=c.members.filter(m=>m!==ME);if(!o.length)return nm(ME)+' (you)';return o.map(u=>nm(u).split(' ')[0]+(o.length===1?nm(u).slice(nm(u).split(' ')[0].length):'')).join(', ');}
function cTitle(c){return c.type==='channel'?'#'+c.name:cName(c);}
function allMsgs(cid){const out=[];for(const m of msgs[cid]||[]){out.push(m);for(const r of m.replies)out.push(r);}return out;}
function mentionsMe(m){return m.html.includes('data-uid="'+ME+'"')||m.html.includes('data-bc="1"');}
function viewing(cid){return S.view==='convo'&&S.cur===cid&&document.visibilityState==='visible';}
function unread(c){if(!c.joined||viewing(c.id))return 0;return (msgs[c.id]||[]).filter(m=>m.ts>c.lastRead&&m.u!==ME).length;}
function mentionCount(c){if(!c.joined||viewing(c.id))return 0;return (msgs[c.id]||[]).filter(m=>m.ts>c.lastRead&&m.u!==ME&&(mentionsMe(m)||c.type!=='channel')).length;}
function find(mid){const m=byId[mid];if(!m)return null;return {m,cid:m.cid,parent:m.parent?byId[m.parent]:null};}
function activity(){
  const out=[];
  for(const cid in msgs){const c=convos[cid];if(!c||!c.joined)continue;
    for(const m of msgs[cid]){
      if(m.u!==ME&&mentionsMe(m))out.push({k:'mention',m,cid,ts:m.ts});
      if(m.u===ME)for(const [e,us] of Object.entries(m.rx))us.filter(u=>u!==ME).forEach(u=>out.push({k:'reaction',m,cid,e,u,ts:m.ts}));
      const mine=m.u===ME||m.replies.some(r=>r.u===ME);
      for(const r of m.replies){if(r.u!==ME&&mentionsMe(r))out.push({k:'mention',m:r,parent:m,cid,ts:r.ts});else if(mine&&r.u!==ME)out.push({k:'thread',m:r,parent:m,cid,ts:r.ts});}
    }
    if(c.type==='client')for(const m of msgs[cid])if(m.u===c.client.u)out.push({k:'client',m,cid,ts:m.ts});
  }
  return out.sort((a,b)=>b.ts-a.ts).slice(0,200);
}
function actUnseen(){return activity().filter(a=>a.ts>S.activitySeen&&a.k!=='reaction').length;}

function av(u,size=36){const x=users[u]||{color:'#888'};const r=size<=20?4:size<=24?5:size<=36?6:10;return `<span class="av ${x.bot?'bot':''}" style="background:${x.color};width:${size}px;height:${size}px;border-radius:${r}px;font-size:${Math.round(size*.4)}px">${esc(initials(u))}</span>`;}

/* ---------- MESSAGES ---------- */
function isCont(prev,m){return prev&&prev.u===m.u&&m.ts-prev.ts<5*MIN&&sameDay(prev.ts,m.ts)&&!m.card&&!prev.card&&!!m.note===!!prev.note&&!m.pinned&&!S.later[m.id]&&!m.fwd&&!m.subject&&!m.bcast&&(m.via||'')===(prev.via||'');}
function fileHTML(f){
  if(f.kind==='img'&&f.img)return `<a href="${esc(f.url)}" target="_blank" rel="noopener"><img class="img-att" src="${esc(f.img)}" alt="${esc(f.name)}" loading="lazy"></a>`;
  const ext=(f.name.split('.').pop()||'').toLowerCase();const k=f.kind==='pdf'||ext==='pdf'?'pdf':['xls','xlsx','csv'].includes(ext)?'xls':'';

function clean(node){
  let out='';
  node.childNodes.forEach(n=>{
    if(n.nodeType===3){out+=md(n.nodeValue.replace(/\u00a0/g,' '));return;}

    if(t==='br'){out+='<br>';return;}

const CMDS=[['/shrug','Append ¯\\_(ツ)_/¯ to your message','[message]'],['/status','Set your status','[:emoji:] [text]'],['/away','Toggle your away status',''],['/topic','Set the channel topic','[text]'],['/invite','Invite someone to this channel','@person'],['/leave','Leave this channel',''],['/mute','Mute this conversation','']];
async function send(key){
  const inp=inputOf(key);if(!inp)return;
  const c=convos[S.cur];const plain=inp.innerText.trim();const fl=S.files[key]||[];
  if(fl.some(f=>!f.path)){toast('Wait for the upload to finish');return;}
  if(key==='main'&&plain.startsWith('/')&&!fl.length){if(await runCmd(plain,c)){inp.innerHTML='';updSend(key);delete S.drafts[c.id];store.set('drafts',S.drafts);return;}}
  const html=tidy(clean(inp));
  if(!html&&!fl.length)return;
  const parent=key==='thread'?S.pane?.mid:null;
  const body={convo:c.id,html,files:fl.map(f=>({path:f.path,name:f.name,size:f.size,kind:f.kind}))};
  if(parent)body.parent=parent;
  if(key==='thread'&&$('#alsoSend')?.checked)body.also=true;
  const mode=c.type==='client'&&key==='main'?(S.mode[c.id]||c.client.via):null;
  if(mode==='note')body.note=true;else if(mode){body.via=mode;if(mode==='email')body.subject=$('#subj')?.value||'GREYS Fine Cheeses';}
  // optimistic
  const tmp={id:tmpId(),cid:c.id,parent:parent||null,u:ME,ts:Date.now(),html,rx:{},replies:[],files:fl.map(f=>({...f,url:f.url})),pending:true,note:mode==='note',via:mode&&mode!=='note'?mode:null,out:!!(mode&&mode!=='note'),status:'sending',subject:body.subject};
  upsertMsg(tmp);
  S.files[key]=[];inp.innerHTML='';if(key==='main'){delete S.drafts[c.id];store.set('drafts',S.drafts);}
  const w=inp.closest('.comp-wrap');const cf=$('.c-files',w);if(cf){cf.innerHTML='';cf.hidden=true;}updSend(key);
  c.lastRead=Date.now();S.newMarker[c.id]=null;
  if(key==='thread')renderPane();else rerenderMsgs(false);
  renderSide();
  try{const r=await api('send',body);removeMsg(tmp.id);upsertMsg(mapMsg(r.msg));if(r.msg.status==='failed')toast(r.msg.error||'Message not sent');}
  catch(e){removeMsg(tmp.id);toast(e.message);if(!inp.textContent.trim())inp.innerHTML=html;}
  refreshMsg();
}
async function runCmd(t,c){
  const [cmd,...rest]=t.split(' ');const arg=rest.join(' ').trim();
  try{
    if(cmd==='/shrug'){await api('send',{convo:c.id,html:esc((arg?arg+' ':'')+'¯\\_(ツ)_/¯')});return true;}
    if(cmd==='/status'){const em=(arg.match(/^(\S+)\s?/)||[])[1]||'💬';const tx=arg.slice(em.length).trim();await api('profile',{status_e:em,status_t:tx});users[ME].status={e:em,t:tx};toast('Status updated');renderAll();return true;}
    if(cmd==='/away'){users[ME].away=!users[ME].away;await api('profile',{away:users[ME].away});toast(users[ME].away?'You are now set to away':'You are now active');renderAll();return true;}
    if(cmd==='/topic'&&c.type==='channel'){await api('update_convo',{convo:c.id,topic:arg});c.topic=arg;toast('Topic updated');renderMain();return true;}
    if(cmd==='/mute'){c.muted=!c.muted;await api('prefs',{convo:c.id,muted:c.muted});toast(c.muted?'Muted '+cTitle(c):'Unmuted '+cTitle(c));renderSide();return true;}
    if(cmd==='/leave'&&c.type==='channel'){await leave(c);return true;}
    if(cmd==='/invite'&&c.type==='channel'){addPeople(c);return true;}
  }catch(e){toast(e.message);return true;}
  toast(cmd+' isn\'t a valid command');return true;
}

function allLater(){const out=[];for(const id in S.later){const m=byId[id];if(m)out.push({m,cid:m.cid,done:S.later[id]==='done'});}return out.sort((a,b)=>b.m.ts-a.m.ts);}
function search(q){
  let from=null,inn=null,file=false;let t=q.replace(/from:@?(\S+)/i,(_,x)=>{from=x.toLowerCase();return''}).replace(/in:#?(\S+)/i,(_,x)=>{inn=x.toLowerCase();return''}).replace(/has:file/i,()=>{file=true;return''}).trim().toLowerCase();
  const out=[];for(const cid in msgs){const c=convos[cid];if(!c||!c.joined)continue;if(inn&&!(cName(c).toLowerCase().includes(inn)))continue;
    for(const m of msgs[cid]){[m,...m.replies].forEach(x=>{const p=preview(x).toLowerCase()+' '+(x.files.map(f=>f.name).join(' ')).toLowerCase()+' '+(x.card?x.card.f.map(f=>f.join(' ')).join(' ').toLowerCase():'');
      if(from&&!nm(x.u).toLowerCase().includes(from))return;if(file&&!x.files.length)return;if(t&&!t.split(/\s+/).every(w=>p.includes(w)))return;out.push({m:x,cid,parent:x===m?null:m});});}}
  return out.sort((a,b)=>b.m.ts-a.m.ts);
}
function hl(s,q){let h=esc(s);const t=q.replace(/(from|in|has):\S+/gi,'').trim();t.split(/\s+/).filter(w=>w.length>1).forEach(w=>{h=h.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');});return h;}

function place(el,anchor,pref='below'){
  document.getElementById('layer').appendChild(el);

  if(x+w>innerWidth-8)x=innerWidth-w-8;if(x<8)x=8;
  if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);if(y<8)y=8;

}

async function loadHistory(cid,fresh){

  got.filter(m=>!m.parent).forEach(upsertMsg);got.filter(m=>m.parent).forEach(upsertMsg);

function newChannel(){const back=modal('Create a channel',`<label for="ncN">Name</label><input id="ncN" class="fld" placeholder="e.g. holiday-party" maxlength="80"><div class="hint">Channels are where conversations happen around a topic. Use lowercase, no spaces.</div><label for="ncT">Topic (optional)</label><input id="ncT" class="fld" placeholder="What's it for?"><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="ncP"> Make private, only invited people can see it</label>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="ncG" disabled>Create</button>`);

  $('#ncG',back).onclick=()=>busy($('#ncG',back),async()=>{const r=await api('create_channel',{name:n.value,private:$('#ncP',back).checked,topic:$('#ncT',back).value});await refetchConvo(r.id);back.remove();open(r.id);if(!$('#ncP',back).checked)toast('Channel created. Add people from the member button.');});}
function clientForm(c){
  const back=modal(c?'Edit client':'Add a client',`<label for="clN">Name</label><input id="clN" class="fld" placeholder="Client or company name" value="${esc(c?.name||'')}"><label for="clP">Mobile number</label><input id="clP" class="fld" inputmode="tel" placeholder="(901) 555-0123" value="${esc(prettyPhone(c?.client.phone||''))}"><label for="clE">Email</label><input id="clE" class="fld" type="email" placeholder="name@example.com" value="${esc(c?.client.email||'')}"><label for="clT">What it's for</label><input id="clT" class="fld" placeholder="Catering · Holiday party Dec 12" value="${esc(c?.client.tag||'')}"><label for="clM">Notes</label><input id="clM" class="fld" placeholder="Guests, date, anything handy" value="${esc(c?.client.meta||'')}">${c?`<label>Reply by default with</label><div class="seg-ctl"><button data-v="sms" class="${c.client.via==='sms'?'on':''}">Text</button><button data-v="email" class="${c.client.via==='email'?'on':''}">Email</button></div>`:''}<div class="hint">Your replies go out by text or email from GREYS. Their text replies come back into this conversation.</div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="clG">${c?'Save':'Add client'}</button>`);
  let via=c?.client.via;back.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){via=b.dataset.v;$$('[data-v]',back).forEach(x=>x.classList.toggle('on',x===b));}});
  $('#clG',back).onclick=()=>busy($('#clG',back),async()=>{const name=$('#clN',back).value.trim();if(!name){$('#clN',back).focus();throw new Error('Add the client\'s name.');}
    const v={name,phone:$('#clP',back).value.trim(),email:$('#clE',back).value.trim(),tag:$('#clT',back).value.trim(),meta:$('#clM',back).value.trim()};
    if(c){await api('update_convo',{convo:c.id,client_name:v.name,client_phone:v.phone,client_email:v.email,client_tag:v.tag,client_meta:v.meta,client_via:via});await refetchConvo(c.id);back.remove();renderAll();toast('Client saved');}
    else{const r=await api('create_client',v);await refetchConvo(r.id);if(r.existed)await loadHistory(r.id,true);back.remove();open(r.id);if(r.existed)toast('That number already had a conversation');}
  });
}
function setStatus(){const pre=[['🗓️','In a meeting'],['🚚','Delivering'],['🏪','On the floor'],['🤒','Out sick'],['🌴','Vacationing'],['🧀','In the cheese cave']];

  const back=modal('Set a status',`<div style="display:flex;gap:8px;align-items:center;border:1px solid var(--cbr);border-radius:8px;padding:0 8px"><button id="stE" style="font-size:20px;width:32px;height:38px">${esc(cur.e)}</button><input id="stT" style="flex:1;border:0;outline:0;background:transparent;height:40px" placeholder="What's your status?" value="${esc(cur.t)}"></div><div class="status-presets" style="margin-top:14px"><div style="font-weight:700;margin-bottom:4px;color:var(--muted);font-size:13px">For GREYS Fine Cheeses</div>${pre.map(([e,t])=>`<div class="mi" data-pe="${e}" data-pt="${t}"><span style="font-size:18px">${e}</span><b style="font-weight:400">${t}</b></div>`).join('')}</div>`,`<button class="btn" id="stX">Clear status</button><button class="btn primary" id="stS">Save</button>`);
  let e=cur.e;back.addEventListener('click',ev=>{const p=ev.target.closest('[data-pe]');if(p){e=p.dataset.pe;$('#stE',back).textContent=e;$('#stT',back).value=p.dataset.pt;}});
  $('#stE',back).onclick=()=>picker($('#stE',back),x=>{e=x;$('#stE',back).textContent=x;});
  $('#stS',back).onclick=()=>busy($('#stS',back),async()=>{const t=$('#stT',back).value.trim();await api('profile',{status_e:t?e:'',status_t:t});users[ME].status=t?{e,t}:null;back.remove();renderAll();toast('Status updated');});
  $('#stX',back).onclick=()=>busy($('#stX',back),async()=>{await api('profile',{status_e:'',status_t:''});users[ME].status=null;back.remove();renderAll();});}
function notifPref(){
  const what='direct messages, @mentions, replies in your threads and client messages while you\'re away from chat';
  if(isIOS&&!standalone())return '<p class="pf-note">To get notifications on an iPhone or iPad, add Greys Chat to your Home Screen: tap <b>Share</b>, then <b>Add to Home Screen</b>. Open Greys Chat from your Home Screen and turn them on here.</p>';
  if(!pushOK())return '<p class="pf-note">This browser can\'t show notifications.</p>';
  if(S.swFail)return '<p class="pf-note">Notifications aren\'t available on this site yet.</p>';
  if(Notification.permission==='denied')return '<p class="pf-note">Notifications are blocked for this site. Allow them in your browser\'s site settings, then come back here.</p>';
  if(S.pushOn)return `<p class="pf-note">On for this device. You'll get a notification for ${what}.</p><div class="pf-row"><button class="btn sm" data-ptest>Send a test</button><button class="btn sm" data-poff>Turn off for this device</button></div>`;
  return `<p class="pf-note">Get a notification on this device for ${what}.</p><button class="btn sm primary" data-pon>Turn on notifications</button>`;}
function prefs(){const t=store.get('theme','system');
  const back=modal('Preferences',`<label>Color mode</label><div class="seg-ctl">${[['light','Light'],['dark','Dark'],['system','Sync with OS']].map(([k,l])=>`<button class="${t===k?'on':''}" data-th="${k}">${l}</button>`).join('')}</div><label>Notifications</label><div id="pfN">${notifPref()}</div><label>Your title</label><input id="pfT" class="fld" value="${esc(users[ME].title)}" placeholder="e.g. Cheesemonger · Memphis">`,`<button class="btn primary" id="pfS">Done</button>`);
  const redo=()=>{const n=$('#pfN',back);if(n)n.innerHTML=notifPref();};
  back.addEventListener('click',e=>{const b=e.target.closest('[data-th]');if(b){applyTheme(b.dataset.th);$$('[data-th]',back).forEach(x=>x.classList.toggle('on',x===b));}
    const on=e.target.closest('[data-pon]');if(on)busy(on,async()=>{const r=await pushOn();redo();toast(r.sent?'Notifications are on. We sent a test to this device.':'Notifications are on for this device.');});
    const tst=e.target.closest('[data-ptest]');if(tst)busy(tst,async()=>{const sub=await pushSub();const r=await api('push_test',{endpoint:sub?sub.endpoint:''});toast(r.sent?'Test sent. Check your notifications.':'Couldn\'t reach this device. Turn notifications off and on again.');});
    const off=e.target.closest('[data-poff]');if(off)busy(off,async()=>{await pushOff();redo();toast('Notifications are off for this device.');});});
  $('#pfS',back).onclick=()=>busy($('#pfS',back),async()=>{const v=$('#pfT',back).value.trim();if(v!==users[ME].title){await api('profile',{title:v});users[ME].title=v;renderAll();}back.remove();});}
function switcher(){
  const back=modal(null,`<div class="sw-in">${ic('search',20)}<input id="swq" placeholder="Jump to a channel, person or client"></div><div class="sw-list" id="swl"></div><div class="sw-foot">↑↓ to navigate · ↵ to open · esc to close</div>`,'',{cls:'switcher'});
  back.querySelector('.mbd').style.padding='0';
  let hi=0,items=[];
  const fill=()=>{const q=$('#swq',back).value.toLowerCase().replace(/^[#@]/,'');
    const cs=Object.values(convos).filter(c=>(c.joined||c.type==='channel')&&cName(c).toLowerCase().includes(q)).sort((a,b)=>unread(b)-unread(a)||(b.joined-a.joined));
    const ppl=STAFF.filter(u=>u!==ME&&nm(u).toLowerCase().includes(q)&&!Object.values(convos).some(c=>c.type==='dm'&&c.joined&&c.members.length===2&&c.members.includes(u))).map(u=>({person:u}));
    items=[...cs,...ppl].slice(0,14);hi=0;draw();};
  const draw=()=>{$('#swl',back).innerHTML=items.map((c,i)=>{if(c.person)return `<div class="mi" data-i="${i}" style="display:flex;align-items:center;gap:10px;padding:0 20px;height:36px;cursor:pointer">${av(c.person,24)}<b style="font-weight:400">${esc(nm(c.person))}</b></div>`;
    const o=c.type==='channel'?`<span class="kind" style="width:24px;height:24px;background:none">${ic(c.private?'lock':'hash',16,2)}</span>`:av(c.type==='client'?c.client.u:(c.members.find(m=>m!==ME)||ME),24);return `<div class="mi" data-i="${i}" style="display:flex;align-items:center;gap:10px;padding:0 20px;height:36px;cursor:pointer">${o}<b style="font-weight:${unread(c)?900:400}">${esc(cName(c))}</b>${c.type==='client'?'<small style="opacity:.7">Client</small>':''}${!c.joined?'<small style="opacity:.7">Not joined</small>':''}${unread(c)?`<span class="badge">${unread(c)}</span>`:''}</div>`;}).join('');
    $$('#swl .mi',back).forEach(e=>{const h=+e.dataset.i===hi;e.style.background=h?'var(--menu-hi)':'';e.style.color=h?'#fff':'';});};
  const go=it=>{back.remove();if(it.person)dmWith([it.person]);else open(it.id);};
  fill();const q=$('#swq',back);q.oninput=fill;
  q.onkeydown=e=>{if(e.key==='ArrowDown'){hi=(hi+1)%items.length;draw();e.preventDefault();}if(e.key==='ArrowUp'){hi=(hi-1+items.length)%items.length;draw();e.preventDefault();}if(e.key==='Enter'&&items[hi])go(items[hi]);if(e.key==='Escape')back.remove();};
  back.addEventListener('click',e=>{const m=e.target.closest('[data-i]');if(m)go(items[+m.dataset.i]);});
}
function shortcuts(){modal('Keyboard shortcuts',`<div class="dbox">${[['Ctrl/⌘ + K','Jump to a conversation'],['↑ in an empty message box','Edit your last message'],['Enter','Send'],['Shift + Enter','New line'],['Ctrl/⌘ + B / I','Bold / italic'],['@ · # · :','Mention, channel, emoji'],['/','Shortcuts like /status, /topic, /shrug'],['Esc','Close panels, or mark the conversation read'],['Alt + ↑ / ↓','Previous / next conversation']].map(([k,v])=>`<div class="drow" style="display:flex;justify-content:space-between;gap:12px"><span>${v}</span><b style="white-space:nowrap">${k}</b></div>`).join('')}</div>`,`<button class="btn primary" data-close>Got it</button>`);}
function addBookmark(){const c=convos[S.cur];const back=modal('Add a bookmark',`<label for="bmU">Link</label><input id="bmU" class="fld" placeholder="https://staff.greyscheese.com/…"><label for="bmT">Name</label><input id="bmT" class="fld" placeholder="Name it">`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="bmG">Add</button>`);
  $('#bmG',back).onclick=()=>busy($('#bmG',back),async()=>{let u=$('#bmU',back).value.trim();if(!u)return;if(!/^https?:/.test(u))u='https://'+u;const list=[...c.bookmarks,{t:$('#bmT',back).value.trim()||u.replace(/^https?:\/\//,''),u,e:'🔗'}];await api('update_convo',{convo:c.id,bookmarks:list});c.bookmarks=list;back.remove();renderMain();});}
async function dmWith(ids){try{const r=await api('dm',{ids:ids.map(Number)});if(!convos[r.id]||!convos[r.id].joined)await refetchConvo(r.id);if(!(msgs[r.id]||[]).length)await loadHistory(r.id,true).catch(()=>{});S.composeTo=[];open(r.id);}catch(e){toast(e.message);}}

/* ---------- uploads ---------- */
function addFiles(files,key){
  const c=convos[S.cur];if(!c||!c.joined)return;
  const fmtSize=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
  files.slice(0,10).forEach(f=>{
    if(f.size>25*1024*1024){toast(f.name+' is over 25 MB');return;}
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    const o={name:f.name,size:fmtSize(f.size),kind:f.type.startsWith('image/')?'img':ext==='pdf'?'pdf':'file',path:null};
    (S.files[key]=S.files[key]||[]).push(o);
    const r=new FileReader();
    r.onload=async()=>{const data=String(r.result);if(o.kind==='img')o.img=data;drawFiles(key);
      try{const res=await api('upload',{convo:c.id,name:f.name,type:f.type,data:data.slice(data.indexOf(',')+1)});o.path=res.path;o.url=res.url;if(o.kind==='img')o.img=res.url||o.img;}
      catch(e){toast(e.message);S.files[key]=(S.files[key]||[]).filter(x=>x!==o);}
      drawFiles(key);};
    r.readAsDataURL(f);
  });
  drawFiles(key);
}
function drawFiles(key){const i=inputOf(key);if(!i)return;const w=i.closest('.comp-wrap');const cf=$('.c-files',w);if(cf){cf.innerHTML=filesHTML(key);cf.hidden=!(S.files[key]||[]).length;}updSend(key);}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('.menu,.picker,#ac,.modal-back')&&$('#layer').children.length&&!t.closest('[data-act="more"],[data-act="rxpick"],[data-act="emoji"]'))closePop();
  if(!t.closest('#ac')&&!t.closest('.c-input'))closeAC();
  const ai=t.closest('#ac .ai');if(ai){acPick(+ai.dataset.ai);return;}
  const go=t.closest('[data-go]');if(go&&!t.closest('[data-act]')){if(S.composeTo)S.composeTo=[];open(go.dataset.go);return;}
  const jm=t.closest('[data-jump]');if(jm&&!t.closest('[data-act]')&&!t.closest('a')){jump(jm.dataset.jump);return;}
  const rmto=t.closest('[data-rmto]');if(rmto){S.composeTo=S.composeTo.filter(u=>u!==rmto.dataset.rmto);S._fillTo?.();return;}
  const rl=t.closest('[data-rail]');if(rl){const v=rl.dataset.rail;if(v==='more'){menu(rl,[{k:'browse',l:ic('hash',16)+'Channels',fn:()=>setView('browse')},{k:'people',l:ic('people',16)+'People',fn:()=>setView('people')},{k:'clients',l:ic('store',16)+'Clients',fn:()=>setView('clients')},{k:'files',l:ic('file',16)+'Files',fn:()=>{S.searchQ='has:file';setView('search');}},'-',{k:'portal',l:ic('apps',16)+'Open staff portal',fn:()=>window.open('https://staff.greyscheese.com','_blank')}]);return;}
    if(v==='convo'){S.view='convo';S.mobMain=false;renderAll();return;}setView(v);return;}
  const tb=t.closest('[data-tab]');if(tb){const v=tb.dataset.tab;if(v==='side'){S.view='convo';S.mobMain=false;renderAll();}else if(v==='memenu')meMenu(tb);else setView(v);return;}
  const vw=t.closest('[data-view]');if(vw){setView(vw.dataset.view);return;}
  const sc=t.closest('[data-sec]');if(sc&&!t.closest('.add')){const k=sc.dataset.sec;S.collapsed[k]=!S.collapsed[k];store.set('collapsed',S.collapsed);renderSide();return;}
  const t2=t.closest('[data-tab2]');if(t2){S.tab=t2.dataset.tab2;renderMain();return;}
  const af=t.closest('[data-af]');if(af){S.actFilter=af.dataset.af;renderMain();return;}
  const lf=t.closest('[data-lf]');if(lf){S.laterFilter=lf.dataset.lf;renderMain();return;}
  const sq=t.closest('[data-sq]');if(sq){S.searchQ=sq.dataset.sq.trim();$('#search').value=S.searchQ;renderMain();return;}
  const md2=t.closest('[data-mode]');if(md2&&!md2.disabled){const c=convos[S.cur];const keep=inputOf('main')?.innerHTML;S.mode[c.id]=md2.dataset.mode;renderMain();if(keep){inputOf('main').innerHTML=keep;updSend('main');}placeEnd(inputOf('main'));return;}
  const fm=t.closest('[data-fmt]');if(fm){e.preventDefault();fmt(fm.dataset.fmt,fm.closest('.comp-wrap'));return;}
  const rm=t.closest('[data-rmfile]');if(rm){const key=rm.closest('.comp-wrap').dataset.key;S.files[key].splice(+rm.dataset.rmfile,1);drawFiles(key);return;}
  const chl=t.closest('.chlink');if(chl){if(convos[chl.dataset.go])open(chl.dataset.go);return;}
  const men=t.closest('.m-body .mention[data-uid]');if(men&&users[men.dataset.uid]){S.pane={type:'profile',uid:men.dataset.uid};renderPane();return;}
  const a=t.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;const mid=a.closest('[data-mid]')?.dataset.mid;
  switch(act){
    case 'quick':toggleRx(mid,a.dataset.e,true);break;
    case 'react':toggleRx(mid,a.dataset.e);break;
    case 'rxpick':picker(a,em=>toggleRx(mid,em,true));break;
    case 'thread':S.pane={type:'thread',mid:a.dataset.mid2||mid};renderPane();break;
    case 'forward':forwardMsg(mid);break;
    case 'save':toggleSave(mid);break;
    case 'laterdone':{const id=a.dataset.mid;S.later[id]=S.later[id]==='done'?'open':'done';api('save',{id,done:S.later[id]==='done'}).catch(er=>toast(er.message));renderMain();renderRail();break;}
    case 'more':moreMenu(a,mid);break;
    case 'permalink':copy(location.origin+location.pathname+'#'+mid);break;
    case 'profile':if(users[a.dataset.uid]){S.pane={type:'profile',uid:a.dataset.uid};renderPane();}break;
    case 'closepane':S.pane=null;renderPane();break;
    case 'details':details(a.dataset.tabx||'about');break;
    case 'star':{const c=convos[S.cur];c.starred=!c.starred;api('prefs',{convo:c.id,starred:c.starred}).catch(er=>toast(er.message));renderSide();renderMain();break;}
    case 'join':{const c=convos[a.dataset.cid||S.cur];busy(a,()=>joinC(c));break;}
    case 'older':busy(a,async()=>{const mm=$('#msgs');const h=mm.scrollHeight;const n=await loadHistory(S.cur);rerenderMsgs();mm.scrollTop=mm.scrollHeight-h;if(!n)toast('That\'s the beginning');});break;
    case 'dmuser':S.pane=null;dmWith([a.dataset.uid]);break;
    case 'addto':S.composeTo.push(a.dataset.uid);$('#toIn').value='';S._fillTo?.();$('#toIn').focus();break;
    case 'startdm':dmWith(S.composeTo);break;
    case 'copytext':copy(a.dataset.t);break;
    case 'send':send(a.closest('.comp-wrap').dataset.key);break;
    case 'attach':S._fileKey=a.closest('.comp-wrap').dataset.key;$('#fileIn').click();break;
    case 'emoji':{const key=a.closest('.comp-wrap').dataset.key;const inp=inputOf(key);const sel=getSelection();const rg=inp.contains(sel.anchorNode)&&sel.rangeCount?sel.getRangeAt(0).cloneRange():null;picker(a,em=>{inp.focus();if(rg){sel.removeAllRanges();sel.addRange(rg);}else placeEnd(inp);document.execCommand('insertText',false,em);updSend(key);});break;}
    case 'atins':{const inp=inputOf(a.closest('.comp-wrap').dataset.key);insertAtCaret(inp,(inp.textContent.endsWith(' ')||!inp.textContent?'':' ')+'@');checkAC(inp);break;}
    case 'slashins':{const inp=inputOf('main');inp.textContent='/';placeEnd(inp);checkAC(inp);break;}
    case 'newchannel':newChannel();break;
    case 'newdm':setView('compose');break;
    case 'newclient':clientForm(null);break;
    case 'clientedit':{const c=S.pane?.type==='profile'&&users[S.pane.uid]?.external?Object.values(convos).find(x=>x.client?.u===S.pane.uid):convos[S.cur];if(c?.client)clientForm(c);break;}
    case 'addbm':addBookmark();break;
    case 'chmore':{const c=convos[S.cur];menu(a,[{k:'det',l:'Conversation details',fn:()=>details(c.type==='client'?'members':'about')},...(c.joined?[{k:'mute',l:c.muted?'Unmute conversation':'Mute conversation',fn:()=>{c.muted=!c.muted;api('prefs',{convo:c.id,muted:c.muted}).catch(er=>toast(er.message));renderSide();toast(c.muted?'Muted':'Unmuted');}},{k:'star',l:c.starred?'Unstar':'Star',fn:()=>{c.starred=!c.starred;api('prefs',{convo:c.id,starred:c.starred}).catch(er=>toast(er.message));renderAll();}}]:[]),{k:'search',l:'Search in conversation',fn:()=>{const s=$('#search');s.value=(c.type==='channel'?'in:#'+c.name:'in:'+cName(c).split(' ')[0])+' ';s.focus();}},...(c.joined&&c.type!=='dm'?['-',{k:'leave',l:c.type==='client'?'Leave client conversation':'Leave channel',red:true,fn:()=>leave(c).catch(er=>toast(er.message))}]:[])],'left');break;}
    case 'wsmenu':menu(a,[`<div class="me-card"><span class="ws-tile" style="margin:0;box-shadow:none">G</span><div><b>GREYS Fine Cheeses</b><small>Memphis · Nashville</small></div></div>`,'-',{k:'pref',l:'Preferences',fn:prefs},{k:'kb',l:'Keyboard shortcuts',fn:shortcuts},'-',{k:'portal',l:'Open staff portal',fn:()=>window.open('https://staff.greyscheese.com','_blank')}]);break;
    case 'memenu':meMenu(a);break;
    case 'create':menu(a,[{k:'m',l:ic('compose',16)+'Message',fn:()=>setView('compose')},{k:'c',l:ic('hash',16)+'Channel',fn:newChannel},{k:'cl',l:ic('store',16)+'Client conversation',fn:()=>clientForm(null)}],'right');break;
    case 'status':setStatus();break;
    case 'prefs':prefs();break;
    case 'mback':S.mobMain=false;if(S.view!=='convo')S.view='convo';renderAll();break;
    case 'jumpdate':menu(a,[{k:'t',l:'Today',fn:()=>{$('#msgs').scrollTop=1e9}},{k:'y',l:'Yesterday',fn:()=>jumpDay(1)},{k:'w',l:'Last week',fn:()=>jumpDay(7)},{k:'b',l:'The very beginning',fn:()=>{$('#msgs').scrollTop=0}}]);break;
  }
});
function jumpDay(d){const target=new Date(new Date(Date.now()-d*DAY).toDateString()).getTime();const m=(msgs[S.cur]||[]).find(m=>m.ts>=target);if(m)$('#msg-'+m.id)?.scrollIntoView({block:'start'});else $('#msgs').scrollTop=0;}
function meMenu(anchor){const u=users[ME];menu(anchor,[`<div class="me-card">${av(ME,36)}<div><b>${esc(u.name)}</b><small><span style="width:8px;height:8px;border-radius:50%;${u.presence==='active'?'background:var(--online)':'box-shadow:inset 0 0 0 1.5px var(--muted)'}"></span>${u.presence==='active'?'Active':'Away'}</small></div></div>`,
  {k:'st',l:u.status?esc(u.status.e+' '+u.status.t):'😀 Update your status',fn:setStatus},
  {k:'aw',l:'Set yourself as <b>&nbsp;'+(u.away?'active':'away')+'</b>',fn:()=>{u.away=!u.away;api('profile',{away:u.away}).catch(er=>toast(er.message));track();renderAll();}},'-',
  {k:'pr',l:'Profile',fn:()=>{S.pane={type:'profile',uid:ME};renderPane();}},{k:'pf',l:'Preferences',fn:prefs},{k:'kb',l:'Keyboard shortcuts',fn:shortcuts},'-',{k:'so',l:'Sign out',fn:()=>signOut(true)}],'right');}
function fmt(cmd,wrap){
  const inp=$('.c-input',wrap);inp.focus();
  if(cmd==='link'){const sel=getSelection();const txt=sel.toString();const rg=sel.rangeCount?sel.getRangeAt(0).cloneRange():null;
    const back=modal('Add link',`<label for="lkT">Text</label><input id="lkT" class="fld" value="${esc(txt)}"><label for="lkU">Link</label><input id="lkU" class="fld" placeholder="https://">`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="lkS">Save</button>`);
    $('#lkS',back).onclick=()=>{let u=$('#lkU',back).value.trim();if(!u)return;if(!/^https?:/.test(u))u='https://'+u;const t=$('#lkT',back).value||u;back.remove();inp.focus();if(rg){const s=getSelection();s.removeAllRanges();s.addRange(rg);}else placeEnd(inp);document.execCommand('insertHTML',false,`<a href="${esc(u)}">${esc(t)}</a>&nbsp;`);updSend(inp.dataset.key);};return;}
  if(cmd==='code'){const s=getSelection().toString();document.execCommand('insertHTML',false,`<code>${esc(s||'code')}</code>&nbsp;`);}
  else if(cmd==='codeblock'){const s=getSelection().toString();document.execCommand('insertHTML',false,`<pre>${esc(s||'code')}</pre><div><br></div>`);}
  else if(cmd==='quote'){document.execCommand('formatBlock',false,'blockquote');}
  else document.execCommand(cmd);
  updSend(inp.dataset.key);
}
document.addEventListener('input',e=>{const inp=e.target.closest?.('.c-input');if(!inp)return;updSend(inp.dataset.key);checkAC(inp);
  if(RT&&S.cur&&(!S._lastType||Date.now()-S._lastType>2500)){S._lastType=Date.now();try{RT.send({type:'broadcast',event:'typing',payload:{c:S.cur,u:ME}});}catch(er){}}});
document.addEventListener('keydown',e=>{
  const inp=e.target.closest?.('.c-input');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(ME)switcher();return;}
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')&&S.view==='convo'){e.preventDefault();const ids=$$('#side [data-go]').map(b=>b.dataset.go);const i=ids.indexOf(S.cur);const n=ids[(i+(e.key==='ArrowDown'?1:-1)+ids.length)%ids.length];if(n)open(n);return;}
  if(inp){
    if(AC){if(e.key==='ArrowDown'){e.preventDefault();acMove(1);return;}if(e.key==='ArrowUp'){e.preventDefault();acMove(-1);return;}if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();acPick();return;}if(e.key==='Escape'){e.preventDefault();closeAC();return;}}
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){const inList=getSelection().anchorNode?.parentElement?.closest('li');if(inList&&!e.ctrlKey&&!e.metaKey){return;}e.preventDefault();send(inp.dataset.key);return;}
    if(e.key==='ArrowUp'&&!inp.textContent.trim()){const list=inp.dataset.key==='thread'?(find(S.pane?.mid)?.m.replies||[]):(msgs[S.cur]||[]);const lm=[...list].reverse().find(m=>m.u===ME&&!m.via&&!m.pending);if(lm){e.preventDefault();editMsg(lm.id);}return;}
    if((e.metaKey||e.ctrlKey)&&['b','i'].includes(e.key.toLowerCase())){e.preventDefault();document.execCommand(e.key.toLowerCase()==='b'?'bold':'italic');return;}
    if((e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key.toLowerCase()==='x'){e.preventDefault();document.execCommand('strikeThrough');return;}
  }
  if(e.key==='Escape'){if($('#layer').children.length){closePop();return;}if(AC){closeAC();return;}if(S.pane){S.pane=null;renderPane();return;}
    if(S.view==='convo'&&convos[S.cur]?.joined){const c=convos[S.cur];markRead(c);S.newMarker[c.id]=null;rerenderMsgs();renderSide();}}
});
document.addEventListener('paste',e=>{const inp=e.target.closest?.('.c-input');if(!inp)return;const files=[...(e.clipboardData?.files||[])];if(files.length){e.preventDefault();addFiles(files,inp.dataset.key);return;}
  const t=e.clipboardData?.getData('text/plain');if(t!=null){e.preventDefault();document.execCommand('insertText',false,t);}});
document.addEventListener('dragover',e=>{if(e.target.closest?.('.main,.pane'))e.preventDefault();});
document.addEventListener('drop',e=>{const z=e.target.closest?.('.main,.pane');if(!z||!e.dataTransfer.files.length)return;e.preventDefault();addFiles([...e.dataTransfer.files],z.classList.contains('pane')?'thread':'main');});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){S._hiddenAt=Date.now();}
  else{lastInput=Date.now();if(S._hiddenAt&&Date.now()-S._hiddenAt>20000)catchUp();if(S.view==='convo'&&convos[S.cur]?.joined){markRead(convos[S.cur]);renderSide();renderRail();}
    if(ME&&pushOK()&&Notification.permission==='granted'&&!S.pushOn&&!store.get('pushOff',false))pushSync();else renderBanner();}
  beat(true);track();});

/* ---------- realtime ---------- */
let RT=null;
function track(){try{RT&&RT.track({u:ME,away:!!users[ME]?.away});}catch(e){}}
const pending={};
function ping(fn,key){clearTimeout(pending[key]);pending[key]=setTimeout(fn,120);}
async function onPing(p){
  if(!p||!p.t)return;
  if(p.t==='msg'){
    const c=convos[p.c];
    if(!c||!c.joined){if(!c){const nc=await refetchConvo(p.c);if(nc&&nc.joined){await loadHistory(nc.id,true).catch(()=>{});renderAll();}}return;}
    let r;try{r=await api('msg',{id:p.m});}catch(e){return;}
    if(!r.msg){removeMsg(p.m);refreshMsg();return;}
    const isNew=!byId[p.m];const m=upsertMsg(mapMsg(r.msg));
    if(isNew&&m&&m.u!==ME){
      if(viewing(c.id)&&!m.parent){markRead(c);}
      const relevant=c.type!=='channel'||mentionsMe(m)||(m.parent&&byId[m.parent]&&(byId[m.parent].u===ME||byId[m.parent].replies.some(x=>x.u===ME)));
      const shown=viewing(c.id)&&(!m.parent||(S.pane?.mid===m.parent));
      if(relevant&&!c.muted&&!shown)notify(c,m);
      if(S.typing[c.id])delete S.typing[c.id][m.u];
    }
    if(S.editing)return;
    if(S.view==='convo'&&S.cur===c.id&&S.tab==='messages')rerenderMsgs();else if(S.view!=='convo')renderMain();
    if(S.pane)renderPane();renderSide();renderRail();showTyping();
  }else if(p.t==='convo'){if(convos[p.c]){await refetchConvo(p.c);ping(()=>{renderSide();if(S.cur===p.c&&S.view==='convo'&&!S.editing&&!inputOf('main')?.textContent.trim())renderMain();},'cv');}}
  else if(p.t==='prof'){ping(refreshPeople,'ppl');}
  else if(p.t==='mem'){if(String(p.e)===ME||convos[p.c]){const nc=await refetchConvo(p.c);if(nc&&nc.joined&&!(msgs[nc.id]||[]).length)await loadHistory(nc.id,true).catch(()=>{});ping(renderSide,'side');ping(renderRail,'rail');}}
}
function connect(){
  if(!window.supabase){$('#conn').hidden=false;return;}
  const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
  RT=sb.channel('greys-chat',{config:{presence:{key:ME},broadcast:{self:false}}});
  RT.on('broadcast',{event:'chg'},({payload})=>{onPing(payload);})
    .on('broadcast',{event:'typing'},({payload})=>{if(!payload||payload.u===ME||!convos[payload.c]?.joined)return;(S.typing[payload.c]=S.typing[payload.c]||{})[payload.u]=Date.now();showTyping();setTimeout(showTyping,5200);})
    .on('presence',{event:'sync'},()=>{const st=RT.presenceState();ONLINE.clear();Object.values(st).forEach(arr=>arr.forEach(x=>{if(!x.away)ONLINE.add(String(x.u));}));ping(()=>{renderSide();renderRail();if(S.pane?.type==='profile')renderPane();},'pres');})
    .subscribe(st=>{S._rtOk=st==='SUBSCRIBED';$('#conn').hidden=S._rtOk;if(S._rtOk){track();if(S._wasDown){S._wasDown=false;catchUp();}}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')S._wasDown=true;});
}
async function resync(){try{const d=await api('boot');ingest(d);renderAll();}catch(e){}}
async function refreshPeople(){try{const d=await api('people');d.people.forEach(mapPerson);STAFF=d.people.map(p=>String(p.id));renderSide();renderRail();if(S.view==='convo'&&S.tab==='messages'&&!S.editing)rerenderMsgs();if(S.pane)renderPane();}catch(e){}}
/* catch-up for anything realtime missed (phone asleep, dropped connection): new, edited or deleted messages */
async function catchUp(){
  if(!ME||S._catching)return;S._catching=true;
  const after=(S.lastSync||Date.now())-120000;const started=Date.now();
  try{const d=await api('since',{after});S.lastSync=started;
    const ms=d.messages.map(mapMsg);if(ms.length){ms.filter(m=>!m.parent).forEach(upsertMsg);ms.filter(m=>m.parent).forEach(upsertMsg);
      for(const id of d.convos||[])if(!convos[id])await refetchConvo(id);
      if(!S.editing)refreshMsg();}}
  catch(e){}finally{S._catching=false;}
}

/* ---------- boot ---------- */
function ingest(d){
  ME=String(d.me);
  STAFF=[];d.people.forEach(p=>{mapPerson(p);STAFF.push(String(p.id));});
  if(!users[ME])mapPerson({id:d.me,name:'You',role:'',location:''});
  const keep=new Set(d.convos.map(c=>c.id));Object.keys(convos).forEach(k=>{if(!keep.has(k))delete convos[k];});
  d.convos.forEach(mapConvo);
  const ms=d.messages.map(mapMsg);
  ms.filter(m=>!m.parent).forEach(upsertMsg);ms.filter(m=>m.parent).forEach(upsertMsg);
  S.later={};d.saved.forEach(s=>S.later[s.message_id]=s.done?'done':'open');
  S.activitySeen=d.activity_seen_at?Date.parse(d.activity_seen_at):Date.now();
  S.sms=d.sms;S.vapid=d.vapid||null;S.lastSync=Date.now();
}
function showGate(err){
  $('#gate').hidden=false;
  $('#gate').innerHTML=`<form class="gate-card" id="gateForm"><span class="ws-tile">G</span><h1>Greys Chat</h1><p>Sign in with your GREYS employee ID, the same one you use in the staff portal.</p><input id="gateId" placeholder="Employee ID" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Employee ID"><button class="btn" type="submit">Sign in</button><div class="err" role="alert">${esc(err||'')}</div><small>Don't have an ID? Ask your manager.</small></form>`;
  const f=$('#gateForm');setTimeout(()=>$('#gateId').focus(),0);
  f.onsubmit=async e=>{e.preventDefault();const v=$('#gateId').value.trim();if(!v){$('.err',f).textContent='Enter your employee ID.';return;}
    const b=$('button',f);b.disabled=true;$('.err',f).textContent='';
    try{const r=await api('login',{login_id:v});TOKEN=r.token;store.set('token',TOKEN);try{localStorage.setItem('greys_emp_id',v);}catch(er){}start();}
    catch(er){$('.err',f).textContent=er.message;b.disabled=false;}};
}
async function start(){
  $('#gate').hidden=false;$('#gate').innerHTML='<div class="loading"><div class="spin"></div>Loading Greys Chat…</div>';
  if(!TOKEN){let portalId=null;try{portalId=localStorage.getItem('greys_emp_id');}catch(e){}
    if(portalId){try{const r=await api('login',{login_id:portalId});TOKEN=r.token;store.set('token',TOKEN);}catch(e){}}
    if(!TOKEN)return showGate();}
  let d;try{d=await api('boot');}catch(e){if(!TOKEN)return showGate();return showGate(e.message);}
  ingest(d);
  $('#gate').hidden=true;
  const [hashMid,hashCid]=(location.hash||'').slice(1).split('@');
  const saved=store.get('cur',null);
  const first=convos[saved]?.joined?saved:(Object.values(convos).find(c=>c.joined&&c.name==='general')||Object.values(convos).find(c=>c.joined))?.id;
  S.mobMain=matchMedia('(min-width:761px)').matches;
  if(first){S.cur=first;const c=convos[first];S.newMarker[first]=unread(c)?c.lastRead:null;S.scrollNew=!!S.newMarker[first];markRead(c);S.hist=[first];}
  renderAll();
  if(hashMid&&byId[hashMid])jump(hashMid);else if(hashCid&&convos[hashCid]?.joined)open(hashCid);
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  connect();
  beat(true);setInterval(()=>beat(),60000);
  if(pushOK()&&!(isIOS&&!standalone()))swReg().then(pushSync).catch(()=>{S.swFail=true;renderBanner();});else renderBanner();
  setInterval(()=>{if(!S._rtOk&&document.visibilityState==='visible')catchUp();},30000);
  setInterval(()=>{if(S.view==='convo'&&S.tab==='messages'&&!S.editing&&!$('#layer').children.length)$$('.tsum .lr').length&&rerenderMsgs();},60000);
}

/* search box + top bar */
const sIn=$('#search');
sIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&sIn.value.trim()){S.searchQ=sIn.value.trim();saveDraft();S.view='search';S.mobMain=true;renderAll();sIn.blur();closePop();}if(e.key==='Escape'){sIn.value='';sIn.blur();closePop();}});
sIn.addEventListener('input',()=>{const q=sIn.value.trim();if(!q||!ME){closePop();return;}const res=search(q).slice(0,5);const cs=Object.values(convos).filter(c=>(c.joined||c.type==='channel')&&cName(c).toLowerCase().includes(q.toLowerCase().replace(/^[#@]/,''))).slice(0,4);
  const el=menu(sIn,[...(cs.length?[`<div class="mh">Conversations</div>`,...cs.map(c=>({k:'c'+c.id,l:`${c.type==='channel'?ic('hash',16):av(c.type==='client'?c.client.u:(c.members.find(m=>m!==ME)||ME),20)}${esc(cName(c))}`,fn:()=>{sIn.value='';open(c.id);}})),'-']:[]),...(res.length?[`<div class="mh">Messages</div>`,...res.map(r=>({k:'m'+r.m.id,l:`${av(r.m.u,20)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${hl(preview(r.m),q)}</span>`,fn:()=>{sIn.value='';jump(r.m.id);}}))]:[]),{k:'all',l:ic('search',16)+'See all results for “'+esc(q)+'”',kbd:'↵',fn:()=>{S.searchQ=q;setView('search');}}]);
  el.style.width=sIn.offsetWidth+'px';el.style.maxWidth='none';});
$('#hBack').innerHTML=ic('left',16,2);$('#hFwd').innerHTML=ic('right',16,2);$('#hRecent').innerHTML=ic('clock',16);$('#searchIco').innerHTML=ic('search',15,2);$('#helpBtn').innerHTML=ic('help',18);
const histGo=i=>{S.hi=i;const id=S.hist[i];if(!convos[id])return;saveDraft();S.view='convo';S.cur=id;S.tab='messages';renderAll();};
$('#hBack').onclick=()=>{if(S.hi>0)histGo(S.hi-1);};
$('#hFwd').onclick=()=>{if(S.hi<S.hist.length-1)histGo(S.hi+1);};
$('#hRecent').onclick=e=>menu(e.currentTarget,[`<div class="mh">Recent</div>`,...[...new Set(S.hist.slice().reverse())].filter(id=>convos[id]).slice(0,8).map(id=>({k:id,l:esc(cTitle(convos[id])),fn:()=>open(id)}))]);
$('#helpBtn').onclick=shortcuts;
$('#fileIn').addEventListener('change',e=>{addFiles([...e.target.files],S._fileKey||'main');e.target.value='';});
start();

</script>
</body>
