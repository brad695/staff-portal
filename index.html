<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#161618"/>
  <title>Portal - GREYS</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <style>
    :root{
      /* ── light cards/content on the deep-blue app background. Home tiles stay dark via --tile* below ── */
      --bg:#0c2637; --surface:#ffffff; --ink:#1a3140; --sub:#5f7688; --line:#dce3ea;
      --accent:#ec8a5e; --wax:#d75a4b; --shadow:0 2px 10px rgba(20,40,60,0.08),0 0 0 1px rgba(20,40,60,0.05);
      --lav:rgba(139,127,232,0.18); --lav-i:#ab9dff; --mint:rgba(46,196,150,0.16); --mint-i:#4fd6a0;
      --sky:rgba(70,140,230,0.18); --sky-i:#6cabff; --peach:rgba(236,138,94,0.20); --peach-i:#f0a274;
      --pink:rgba(230,90,150,0.18); --pink-i:#f27cb1; --butter:rgba(214,170,50,0.20); --butter-i:#e8c765;
      --gray:rgba(255,255,255,0.08); --gray-i:#b9c5d1;
      /* dark home tiles (the primary-action buttons stay dark on purpose) */
      --tile:#16303f; --tile-line:#294455; --tile-ink:#eaf1f6;
      --r:20px;
    }
    *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body{ height:100%; }
    body{ font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); }
    .app{ max-width:520px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:84px; }

    /* top bar / header */
    .topbar{ display:flex; align-items:center; gap:10px; padding:16px 20px 14px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:4px; flex-wrap:wrap; }
    /* small phones (<=380px): the three top links used to run past the right edge */
    @media (max-width:380px){
      .topbar{ padding:14px 14px 12px; gap:7px; }
      .top-link{ font-size:0.72rem; padding:6px 10px; }
    }
    /* very small phones (<=340px): shrink the tiles rather than let the two-up
       grid overflow. Deliberately NOT overflow-wrap:break-word — that shreds
       longer labels like "Stuff to Know" into single letters. */
    @media (max-width:340px){
      .tiles{ gap:10px; padding:12px 12px 2px; }
      .tile{ padding:10px 12px; gap:10px; }
      .tile .ic{ width:30px; height:30px; }
      .tile .tl{ font-size:1rem; }
    }
    .topbar .brand{ font-weight:800; font-size:1.35rem; letter-spacing:-0.3px; color:#ffffff; }
    .topbar .loc{ font-size:0.74rem; color:#b9c5d1; font-weight:600; }
    .topbar .spacer{ flex:1; }
    .icon-btn{ width:40px; height:40px; border-radius:50%; border:none; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:1.05rem; cursor:pointer; color:var(--ink); text-decoration:none; }
    .top-link{ color:#b9c5d1; font-size:0.8rem; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,0.2); padding:7px 13px; border-radius:12px; background:none; cursor:pointer; font-family:inherit; }
    .top-link:hover{ color:#fff; }

    /* location switcher — three segmented buttons under the header */
    .loc-bar{ display:flex; gap:8px; padding:12px 20px 0; }
    .loc-tab{ flex:1; padding:10px 0; border-radius:12px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#b9c5d1; font-weight:700; font-size:0.86rem; cursor:pointer; font-family:inherit; }
    .loc-tab.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
    @media(min-width:1000px){ .loc-bar{ padding:14px 28px 0; } }

    /* views */
    .view{ display:none; }
    .view.active{ display:block; }

    /* HOME */
    .home-head{ padding:8px 20px 4px; }
    .home-head h1{ font-size:1.85rem; font-weight:800; letter-spacing:-0.6px; line-height:1.1; color:#ffffff; }
    .home-head .when{ color:#b9c5d1; font-size:0.86rem; font-weight:600; margin-top:4px; }

    .notes-banner{ margin:14px 20px 4px; }
    .note-card{ background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:13px 16px; margin-bottom:10px; cursor:pointer; }
    .note-card .nt{ font-weight:700; font-size:0.92rem; display:flex; align-items:center; gap:7px; }
    .note-card .nt .chev{ margin-left:auto; color:var(--sub); font-size:0.8rem; transition:transform .2s; }
    .note-card.open .nt .chev{ transform:rotate(180deg); }
    .note-card .nb{ display:none; font-size:0.88rem; color:var(--ink); line-height:1.5; margin-top:8px; white-space:pre-wrap; }
    .note-card.open .nb{ display:block; }
    .notes-empty{ display:none; }

    .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px 20px 2px; }
    .tile{ background:var(--tile); border-radius:4px; box-shadow:0 3px 12px rgba(20,40,60,0.16); padding:10px 16px; cursor:pointer; border:1px solid var(--tile-line); text-align:left; transition:transform .08s, box-shadow .08s; display:flex; flex-direction:row; align-items:center; gap:14px; min-width:0; }
    .tile:active{ transform:scale(0.97); }
    .tile.on{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 3px 12px rgba(0,0,0,0.20); }
    .tile .ic{ width:34px; height:34px; border-radius:4px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .tile .ic i{ font-size:19px; line-height:1; }
    .tile .tl{ font-weight:700; font-size:1.18rem; letter-spacing:-0.3px; color:var(--tile-ink); line-height:1.15; min-width:0; }
    .tile.full{ grid-column:1 / -1; }
    .badge-soon{ margin-left:auto; font-size:0.64rem; font-weight:700; color:var(--gray-i); background:var(--gray); padding:5px 11px; border-radius:20px; }
    .ic-mint{ background:var(--mint); color:var(--mint-i);} .ic-sky{ background:var(--sky); color:var(--sky-i);}
    .ic-lav{ background:var(--lav); color:var(--lav-i);} .ic-peach{ background:var(--peach); color:var(--peach-i);}
    .ic-pink{ background:var(--pink); color:var(--pink-i);} .ic-butter{ background:var(--butter); color:var(--butter-i);}
    .ic-gray{ background:var(--gray); color:var(--gray-i);}
    .icon-btn i{ font-size:20px; line-height:1; } .home-btn i{ font-size:26px; line-height:1; }
    .home-preview{ margin:12px 20px 4px; background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:14px 16px; }
    .pv-head{ display:flex; align-items:center; margin-bottom:6px; }
    .pv-title{ font-weight:800; font-size:0.95rem; }
    .pv-title i{ font-size:17px; vertical-align:-2px; margin-right:5px; color:var(--accent); }
    .pv-all{ margin-left:auto; border:none; background:none; color:var(--accent); font-weight:700; font-size:0.82rem; cursor:pointer; font-family:inherit; }
    .pv-row{ padding:9px 2px; border-top:1px solid var(--line); font-size:0.9rem; cursor:pointer; }
    .pv-row:first-of-type{ border-top:none; }
    .pv-day{ color:var(--accent); font-weight:700; font-size:0.72rem; text-transform:uppercase; margin-right:6px; }
    .pv-empty{ color:var(--sub); font-size:0.86rem; padding:6px 2px; }

    /* section header */
    .sec-head{ position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:center; gap:12px; padding:16px 18px 10px; }
    .back-btn{ width:42px; height:42px; border-radius:50%; border:none; background:var(--surface); box-shadow:var(--shadow); font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); }
    .sec-head h2{ font-size:1.5rem; font-weight:800; letter-spacing:-0.5px; color:#ffffff; }
    .sec-body{ padding:6px 18px 20px; }

    /* generic card list */
    .card{ background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin-bottom:12px; }
    .card .c-top{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
    .c-day{ font-size:0.72rem; font-weight:800; letter-spacing:0.2px; color:var(--accent); text-transform:uppercase; }
    .c-day.wax{ color:var(--wax); } .c-day.gold{ color:var(--butter-i); }
    .c-title{ font-weight:700; font-size:1.05rem; letter-spacing:-0.2px; margin-top:2px; }
    .c-body{ font-size:0.9rem; color:var(--sub); line-height:1.5; margin-top:5px; }
    .c-pill{ font-size:0.64rem; font-weight:800; text-transform:uppercase; letter-spacing:0.3px; padding:3px 9px; border-radius:20px; }
    .pill-rep{ background:var(--butter); color:var(--butter-i); }
    .empty{ text-align:center; color:var(--sub); padding:48px 20px; font-size:0.92rem; }
    .empty .ic{ font-size:2.4rem; display:block; margin-bottom:10px; }
    .flash{ animation:flash 1.8s ease; }
    @keyframes flash{ 0%,100%{ box-shadow:var(--shadow);} 25%{ box-shadow:0 0 0 3px rgba(236,138,94,0.6);} }

    /* specials accent */
    .card.special{ border-left:4px solid var(--mint-i); }
    .card.special .c-day{ color:var(--mint-i); }
    .card.event{ border-left:4px solid var(--pink-i); }
    .card.event .c-day{ color:var(--pink-i); }
    .card.event.past{ opacity:0.6; }
    .card.sched{ border-left:4px solid var(--peach-i); }
    .card.sched .c-day{ color:var(--peach-i); }
    .card.timeoff{ border-left:4px solid var(--wax); }
    .card.timeoff .c-day{ color:var(--wax); }

    /* reservation cards */
    .res-filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:flex-end; }
    .fg{ display:flex; flex-direction:column; gap:4px; }
    .fg label{ font-size:0.64rem; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:0.3px; }
    .fg input, .fg select{ padding:9px 11px; border:1px solid var(--line); border-radius:12px; font-size:0.86rem; background:var(--surface); font-family:inherit; color:var(--ink); }
    .btn{ border:none; border-radius:14px; padding:11px 18px; font-size:0.9rem; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-primary{ background:var(--accent); color:#fff; }
    .btn-block{ width:100%; }
    .res-card{ background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; }
    .res-when{ text-align:center; min-width:58px; }
    .res-when .t{ font-weight:800; font-size:0.98rem; }
    .res-when .d{ font-size:0.68rem; color:var(--sub); font-weight:600; }
    .res-main{ flex:1; min-width:0; }
    .res-name{ font-weight:700; font-size:0.98rem; }
    .res-meta{ font-size:0.78rem; color:var(--sub); margin-top:2px; }
    .res-contact{ display:flex; flex-wrap:wrap; gap:3px 14px; margin-top:4px; font-size:0.78rem; }
    .res-contact a{ color:var(--accent); text-decoration:none; font-weight:600; word-break:break-all; }
    .res-note{ font-size:0.78rem; color:var(--sub); margin-top:4px; font-style:italic; }
    .res-badge{ font-size:0.62rem; font-weight:800; text-transform:uppercase; padding:4px 9px; border-radius:20px; white-space:nowrap; }
    .b-ok{ background:var(--mint); color:var(--mint-i); }
    .b-cancel{ background:rgba(224,104,91,0.18); color:#f0897c; }
    .b-req{ background:var(--butter); color:var(--butter-i); }
    .res-card.req{ flex-wrap:wrap; border-left:4px solid var(--butter-i); }
    .res-actions{ flex-basis:100%; display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
    .res-actions .btn{ padding:9px 16px; font-size:0.82rem; flex:1; }
    .btn-approve{ background:var(--accent); color:#fff; }
    .btn-decline{ background:none; border:1px solid #e6a8a0; color:var(--wax); }
    .res-actions .btn:disabled{ opacity:0.5; }
    .b-other{ background:rgba(20,40,60,0.06); color:#5f7688; }
    .res-stats{ font-size:0.8rem; color:var(--sub); font-weight:600; margin-bottom:10px; }
    .res-card.cancel .res-name{ text-decoration:line-through; color:var(--sub); }
    .res-group{ margin-top:24px; }
    .res-group-title{ font-size:1.05rem; font-weight:800; letter-spacing:-0.3px; color:#ffffff; margin-bottom:10px; }
    .res-group-empty{ font-size:0.86rem; color:#b9c5d1; padding:4px 2px 2px; }
    .home-preview .res-group-empty{ color:var(--sub); }

    /* calendar */
    .cal-bar{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .cal-bar h3{ font-size:1.05rem; font-weight:800; flex:1; text-align:center; }
    .cal-nav{ width:38px; height:38px; border-radius:50%; border:none; background:var(--surface); box-shadow:var(--shadow); font-size:1rem; cursor:pointer; }
    .cal-today{ border:none; background:var(--accent); color:#fff; border-radius:12px; padding:8px 13px; font-weight:700; font-size:0.78rem; cursor:pointer; }
    .cal-print{ border:none; background:var(--surface); color:var(--ink); box-shadow:var(--shadow); border-radius:12px; padding:8px 13px; font-weight:700; font-size:0.78rem; cursor:pointer; }
    .cal-legend{ display:flex; flex-wrap:wrap; gap:9px 14px; font-size:0.72rem; color:var(--sub); margin-bottom:12px; }
    .cal-legend .dot{ width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:middle; }
    .cal-grid{ background:var(--surface); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
    .cal-hrow,.cal-body{ display:grid; grid-template-columns:repeat(7,1fr); }
    .cal-hcell{ text-align:center; font-size:0.62rem; font-weight:700; color:var(--sub); padding:9px 0; text-transform:uppercase; }
    .cal-day{ min-height:54px; border-top:1px solid var(--line); border-right:1px solid var(--line); padding:4px 4px; position:relative; cursor:pointer; }
    .cal-day.sel{ box-shadow:inset 0 0 0 2px var(--accent); }
    .cal-detail{ background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin-top:14px; }
    .cd-date{ font-weight:800; font-size:1.0rem; margin-bottom:4px; }
    .cd-block{ margin-top:12px; }
    .cd-lbl{ font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:0.3px; color:var(--sub); margin-bottom:3px; }
    .cd-item{ font-size:0.9rem; padding:4px 0; line-height:1.35; }
    .cd-x{ color:var(--wax); font-weight:700; }
    .cal-day:nth-child(7n){ border-right:none; }
    .cal-day.other{ background:rgba(20,40,60,0.035); }
    .cal-daynum{ font-size:0.72rem; font-weight:700; color:var(--ink); }
    .cal-day.other .cal-daynum{ color:#5f7488; }
    .cal-day.today .cal-daynum{ background:var(--accent); color:#fff; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.66rem; }
    .cal-dot{ height:5px; border-radius:3px; margin:2px 1px 0; }
    .cal-more{ font-size:0.56rem; color:var(--sub); margin-top:1px; }
    .cd-res{ background:#9fc0ee; } .cd-cancel{ background:#e6a8a0; } .cd-event{ background:#eaa6c6; }
    .cd-special{ background:#8fd3b2; } .cd-sched{ background:#eac08c; } .cd-off{ background:#d99a90; }
    .ag-day{ background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:13px 16px; margin-bottom:12px; }
    .ag-date{ font-weight:800; font-size:0.95rem; margin-bottom:6px; display:flex; align-items:center; }
    .ag-day.ag-past{ opacity:.6; }
    .ag-today{ font-size:0.6rem; font-weight:800; background:var(--accent); color:#fff; padding:2px 8px; border-radius:20px; margin-left:7px; text-transform:uppercase; }
    .ag-row{ font-size:0.9rem; padding:7px 0; border-top:1px solid var(--line); display:flex; align-items:flex-start; gap:8px; line-height:1.35; }
    .ag-tag{ font-size:0.58rem; font-weight:800; text-transform:uppercase; letter-spacing:0.2px; padding:3px 8px; border-radius:20px; white-space:nowrap; flex-shrink:0; margin-top:1px; }
    .t-res{ background:rgba(70,140,230,0.18); color:#6cabff; } .t-cancel{ background:rgba(224,104,91,0.18); color:#f0897c; }
    .t-event{ background:rgba(230,90,150,0.18); color:#f27cb1; } .t-special{ background:rgba(46,196,150,0.16); color:#4fd6a0; }
    .t-class{ background:rgba(214,170,50,0.20); color:#e8c765; }
    .t-exp{ background:rgba(165,43,30,0.14); color:#a52b1e; }
    .xt{ margin-top:8px; border-top:1px solid rgba(0,0,0,.08); padding-top:8px; }
    .xt-h{ font-weight:700; font-size:.8rem; margin-bottom:6px; }
    .xt-m{ font-size:.82rem; line-height:1.4; padding:6px 9px; border-radius:8px; margin:0 0 6px; background:#f3f4f6; max-width:92%; }
    .xt-out{ background:#fdf3dc; margin-left:auto; }
    .xt-note{ background:#eef2ff; font-style:italic; }
    .xt-w{ font-size:.7rem; color:#6b7280; margin-bottom:2px; }
    .xt-a{ display:inline-block; font-size:.8rem; font-weight:700; color:#0b6aa9; text-decoration:none; margin-top:2px; }
    .t-sched{ background:rgba(236,138,94,0.20); color:#f0a274; } .t-off{ background:rgba(224,104,91,0.18); color:#f0897c; }
    /* Square future orders. Inked darker than the tags above because these
       land on the white agenda card and have to be readable at a glance. */
    .t-pickup{ background:rgba(29,78,216,0.13); color:#1d4ed8; }
    .t-order{ background:rgba(4,120,87,0.13); color:#047857; }
    .t-delivery{ background:rgba(180,83,9,0.13); color:#b45309; }
    .ag-sub{ font-size:0.78rem; color:var(--sub); margin-top:2px; }
    /* expandable agenda rows: title only until tapped */
    .ag-body{ flex:1; min-width:0; }
    .ag-row.ag-x{ cursor:pointer; }
    .ag-chev{ font-style:normal; font-size:0.66rem; color:var(--sub); margin-left:6px; display:inline-block; transition:transform .15s ease; }
    .ag-row.open .ag-chev{ transform:rotate(180deg); }
    .ag-det{ display:none; font-size:0.82rem; color:var(--sub); margin-top:6px; padding:7px 0 3px 10px; border-left:2px solid var(--line); white-space:pre-wrap; }
    .ag-row.open .ag-det{ display:block; }
    .ag-det .k{ font-weight:700; color:var(--ink); }
    .ag-unpaid{ color:#be123c; font-weight:700; }
    .ag-ok, .ag-tent{ font-size:0.78rem; }
    .ag-strike{ text-decoration:line-through; color:var(--sub); }

    /* time off form */
    .form-card{ background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:18px; margin-bottom:16px; }
    .form-card h3{ font-size:1.0rem; font-weight:800; margin-bottom:14px; }
    .field{ margin-bottom:12px; }
    .field label{ font-size:0.7rem; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:0.3px; display:block; margin-bottom:5px; }
    .field input{ width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:13px; font-size:0.92rem; font-family:inherit; background:#f5f8fb; color:var(--ink); }
    .field input:focus{ outline:none; border-color:var(--accent); }
    .row2{ display:flex; gap:10px; } .row2 .field{ flex:1; }
    .to-msg{ font-size:0.84rem; font-weight:700; margin-top:8px; display:none; }
    .req-item{ display:flex; align-items:flex-start; gap:12px; background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:13px 15px; margin-bottom:10px; }
    .req-info{ flex:1; min-width:0; }
    .req-name{ font-weight:700; font-size:0.95rem; }
    .req-meta{ font-size:0.78rem; color:var(--sub); margin-top:2px; }
    .req-reason{ font-size:0.76rem; color:var(--sub); font-style:italic; margin-top:2px; }
    .st-badge{ font-size:0.6rem; font-weight:800; text-transform:uppercase; padding:4px 9px; border-radius:20px; }
    .st-pending{ background:var(--butter); color:var(--butter-i); }
    .st-approved{ background:var(--mint); color:var(--mint-i); }
    .st-denied{ background:rgba(224,104,91,0.18); color:#f0897c; }

    .section-label{ font-size:0.74rem; font-weight:800; color:var(--sub); text-transform:uppercase; letter-spacing:0.4px; margin:6px 2px 10px; }

    /* bottom bar */
    .botbar{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; justify-content:center; padding:12px 0 calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }

    _calEvents = items.filter(i=>i.type==='event').map(_evMap);   // calendar keeps archived (past) events

// ── STUFF TO KNOW (quick reference) ──
// after escaping, turn URLs (and site-relative .pdf paths) into tappable links
function linkify(s){ return s.replace(/(https?:\/\/[^\s<]+|(?:^|\s)\/[A-Za-z0-9._\-\/]+\.pdf)/g, m=>{ const pre=m.match(/^\s/)?m[0]:''; const url=m.trim(); return pre+'<a href="'+url+'" target="_blank" rel="noopener">'+url+'</a>'; }); }
function renderStuff(){
  const el = document.getElementById('stuffBody'); if(!el) return;
  if(!_info.length){ el.innerHTML = '<div class="empty"><span class="ic"><i class="ti ti-info-circle"></i></span>Nothing here yet.<br>A manager can add quick-reference info in the console.</div>'; return; }
  el.innerHTML = _info.map(x=>'<div class="info-card"><div class="il">'+esc(x.title)+'</div>'+(x.body?'<div class="iv">'+linkify(esc(x.body))+'</div>':'')+'</div>').join('');
}

function occurrences(item, winStart, winEnd){
  const out=[]; if(!item.date) return out;
  const rep=item.repeat||'none';
  const start=new Date(item.date+'T12:00:00');
  const winS=new Date(winStart+'T12:00:00'), winE=new Date(winEnd+'T12:00:00');
  const until=item.repeatUntil?new Date(item.repeatUntil+'T12:00:00'):winE;
  const hardEnd=until<winE?until:winE;
  if(rep==='none'){ if(start>=winS && start<=winE) out.push(fmt(start)); return out; }
  let d=new Date(start), i=0;
  while(d<=hardEnd && i<600){ if(d>=winS) out.push(fmt(d));
    if(rep==='weekly') d.setDate(d.getDate()+7); else if(rep==='biweekly') d.setDate(d.getDate()+14); else if(rep==='monthly') d.setMonth(d.getMonth()+1); else break; i++; }
  return out;
}
function repeatLabel(r){ return r==='weekly'?'Weekly':r==='biweekly'?'Every 2 wks':r==='monthly'?'Monthly':''; }
function currentWeek(){ const d=new Date(); d.setHours(0,0,0,0); const mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7)); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return { start:fmt(mon), end:fmt(sun) }; }

// NOTES -> home banner cards (title; tap to expand)
function renderNotes(){
  const grid=document.getElementById('notesGrid'); if(!grid) return;
  if(!_notes.length){ grid.innerHTML=''; return; }
  grid.innerHTML = _notes.map(n => `<div class="note-card${n.body?'':' nobody'}"${n.body?` onclick="this.classList.toggle('open')"`:''}>
    <div class="nt">📌 ${esc(n.title)}${n.body?'<span class="chev">▾</span>':''}</div>
    ${n.body?`<div class="nb">${esc(n.body)}</div>`:''}
  </div>`).join('');
}

// SPECIALS (week Mon–Sun): range special = one entry; recurring = per occurrence
function weekSpecialEntries(){
  const wk=currentWeek(); const entries=[];
  _specials.forEach(s=>{ const rep=s.repeat||'none';
    if(rep==='none' && s.endDate && s.endDate>s.date){ if(s.date<=wk.end && s.endDate>=wk.start) entries.push({s,start:s.date,end:s.endDate,range:true}); }
    else { occurrences(s, wk.start, wk.end).forEach(d=>entries.push({s,start:d,end:d,range:false})); }
  });
  return entries.sort((a,b)=>a.start.localeCompare(b.start)||(a.s.time||'').localeCompare(b.s.time||''));
}
function specialDayLabel(e){ const today=fmt(new Date());
  if(e.range){ const now=(today>=e.start&&today<=e.end)?'⭐ Now · ':''; return now+fmtDisplay(e.start)+' – '+fmtDisplay(e.end); }
  return e.start===today?'⭐ Today':fmtDisplay(e.start);
}
function renderSpecialsFull(){
  const grid=document.getElementById('specialsFullGrid'); if(!grid) return;
  const entries=weekSpecialEntries();
  if(!entries.length){ grid.innerHTML='<div class="empty"><span class="ic">🍽️</span>No specials this week.</div>'; return; }
  grid.innerHTML = entries.map(e=>{ const s=e.s; const rl=repeatLabel(s.repeat); const tm=s.time?fmtTime(s.time):'';
    return `<div class="card special" id="spec-${s.id}-${e.start}">
      <div class="c-day">${specialDayLabel(e)}${tm?' · '+tm:''}${rl?' · ↻ '+rl:''}</div>
      <div class="c-title">${esc(s.title)}</div>
      ${s.body?`<div class="c-body">${esc(s.body)}</div>`:''}
    </div>`; }).join('');
}

// EVENTS
function eventInstances(winStart, winEnd){ const out=[]; _events.forEach(ev=>{ occurrences(ev, winStart, winEnd).forEach(d=>out.push(Object.assign({},ev,{date:d,_repeat:ev.repeat}))); }); return out.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'').localeCompare(b.time||'')); }
function renderEventCards(){
  const grid=document.getElementById('eventsGrid'); if(!grid) return;
  const today=fmt(new Date()); const horizon=fmt(new Date(Date.now()+150*864e5));
  const singles=_events.filter(e=>(e.repeat||'none')==='none');
  const recurring=[]; _events.filter(e=>(e.repeat||'none')!=='none').forEach(ev=>{ occurrences(ev,today,horizon).forEach(d=>recurring.push(Object.assign({},ev,{date:d,endDate:'',_repeat:ev.repeat}))); });
  const all=singles.concat(recurring).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'').localeCompare(b.time||''));
  if(!all.length){ grid.innerHTML='<div class="empty"><span class="ic">🎉</span>No events yet.</div>'; return; }
  grid.innerHTML = all.map(ev=>{ const isPast=ev.date<today; const tm=ev.time?' · '+fmtTime(ev.time):'';
    const range=(ev.endDate&&ev.endDate!==ev.date)?fmtDisplay(ev.date)+' – '+fmtDisplay(ev.endDate):fmtDisplay(ev.date);
    const rl=(ev._repeat&&ev._repeat!=='none')?' · ↻ '+repeatLabel(ev._repeat):'';
    return `<div class="card event${isPast?' past':''}" id="ev-${ev.id}-${ev.date}">
      <div class="c-day">${isPast?'Past · ':''}${range}${tm}${rl}</div>
      <div class="c-title">${esc(ev.name)}</div>
      ${ev.desc?`<div class="c-body">${esc(ev.desc)}</div>`:''}
    </div>`; }).join('');
}

// ═══ SCHEDULES ═══
let _schedules=[];
function mapSched(r){ return { id:r.id, name:r.name, date:r.date, endDate:r.end_date||'', note:r.note||'' }; }
async function loadSchedules(){
  try{ const { data } = await sb.from('portal_schedules').select('*').eq('location', LOC).order('date'); _schedules=(data||[]).map(mapSched); }catch(e){ _schedules=[]; }
  renderSchedCards();

}
function approvedTimeOff(){ return (_timeOff||[]).filter(r=>r.status==='approved').map(r=>({ id:r.id, name:r.name, date:r.startDate, endDate:r.endDate||'', note:r.reason||'', timeoff:true })); }
function combinedSchedule(){ return _schedules.map(s=>Object.assign({timeoff:false},s)).concat(approvedTimeOff()).sort((a,b)=>(a.date||'').localeCompare(b.date||'')); }
function renderSchedCards(){
  const grid=document.getElementById('schedGrid'); if(!grid) return;
  const today=fmt(new Date()); const items=combinedSchedule();
  if(!items.length){ grid.innerHTML='<div class="empty"><span class="ic">📆</span>No schedules yet.</div>'; return; }
  grid.innerHTML = items.map(s=>{ const isPast=(s.endDate||s.date)<today;
    const range=(s.endDate&&s.endDate!==s.date)?fmtDisplay(s.date)+' – '+fmtDisplay(s.endDate):fmtDisplay(s.date);
    if(s.timeoff){ return `<div class="card timeoff${isPast?' past':''}">
      <div class="c-day">🌴 ${isPast?'Past · ':''}${range} · Time Off</div>
      <div class="c-title">${esc(s.name)}</div>
      ${s.note?`<div class="c-body">"${esc(s.note)}"</div>`:''}</div>`; }
    return `<div class="card sched${isPast?' past':''}">
      <div class="c-day">${isPast?'Past · ':''}${range}</div>
      <div class="c-title">${esc(s.name)}</div>
      ${s.note?`<div class="c-body">${esc(s.note)}</div>`:''}</div>`; }).join('');
}

// ═══ TIME OFF ═══
let _timeOff=[];
function mapTimeOff(r){ return { id:r.id, name:r.name, startDate:r.start_date, endDate:r.end_date||'', reason:r.reason||'', status:r.status||'pending', submittedAt:r.submitted_at }; }
async function loadTimeOff(){
  try{ const { data } = await sb.from('portal_time_off').select('*').eq('location', LOC).order('start_date'); _timeOff=(data||[]).map(mapTimeOff); }catch(e){ _timeOff=[]; }
  renderTimeOffList(); renderSchedCards();

async function submitTimeOff(){
  const name=(document.getElementById('toName').value||'').trim();
  const startDate=document.getElementById('toStart').value;
  const endDate=document.getElementById('toEnd').value;
  const reason=(document.getElementById('toReason').value||'').trim();
  if(!name){ showToMsg('Please enter your name.', false); return; }
  if(!startDate){ showToMsg('Please pick a start date.', false); return; }
  try{
    const { error } = await sb.from('portal_time_off').insert({ name, start_date:startDate, end_date:endDate||null, reason, location:LOC });
    if(error) throw error;
    await loadTimeOff();
    document.getElementById('toName').value=''; document.getElementById('toEnd').value=''; document.getElementById('toReason').value='';
    showToMsg('✅ Request submitted!', true);

// Approve / decline a REQUESTED reservation (Nashville takes manual-approval requests).
// The edge function only allows REQUESTED → RESERVED/DECLINED, and Wix notifies the guest.
async function resDecide(id, approve, btn){
  let reason='';
  if(approve){
    if(!confirm('Approve this reservation? The guest will get their confirmation.')) return;
  } else {
    reason=prompt('Decline this reservation request?\nOptional reason (the guest may see it):');
    if(reason===null) return;
  }
  const cardBtns=btn?btn.parentNode.querySelectorAll('.btn'):[];
  cardBtns.forEach(b=>b.disabled=true);
  try{
    const res=await fetch(FN_URL+'?action=set-reservation', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer '+SB_KEY },
      body:JSON.stringify({ id, status:approve?'RESERVED':'DECLINED', reason:(reason||'').trim() })
    });
    const d=await res.json().catch(()=>({}));
    if(!res.ok || !d.ok) throw new Error(d.error||'Update failed');
    if(_resLoaded && document.getElementById('view-resys').classList.contains('active')) loadReservations();
    else if(_openTile==='resys') loadResysPreview();
    else if(_resLoaded) loadReservations();
  }catch(e){
    cardBtns.forEach(b=>b.disabled=false);
    alert('❌ '+(e.message||'Could not update the reservation. Try again.'));
  }
}

// millisecond timestamp of a reservation's start, or null when unparseable
function resStartMs(r){ const s=r&&r.details&&r.details.startDate; const d=s?new Date(s):null; return (d&&!isNaN(d.getTime()))?d.getTime():null; }
// "This Week" = Monday 00:00 (local) of the current week → the following Monday 00:00 (exclusive),
// i.e. Mon–Sun. "Future" = anything on/after next Monday 00:00. Past reservations appear only in the main list.
// Renders into whichever container ids are passed, so both the Resys view and the Home page can reuse it.
function renderResGroupsInto(recs, weekGroupId, weekListId, futureGroupId, futureListId){
  const weekGroup=document.getElementById(weekGroupId), futureGroup=document.getElementById(futureGroupId);
  const weekList=document.getElementById(weekListId), futureList=document.getElementById(futureListId);
  if(!weekGroup||!futureGroup||!weekList||!futureList) return;
  const now=new Date();
  const dow=(now.getDay()+6)%7;                                                     // 0=Mon … 6=Sun
  const weekStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow).getTime();
  const weekEnd=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+7).getTime();
  const week=[], future=[];
  for(const r of recs){ const t=resStartMs(r); if(t==null) continue;
    if(t>=weekStart && t<weekEnd) week.push(r);
    else if(t>=weekEnd) future.push(r);
  }
  const byStart=(a,b)=>resStartMs(a)-resStartMs(b);
  week.sort(byStart); future.sort(byStart);
  weekList.innerHTML   = week.length   ? week.map(resCardHTML).join('')   : '<div class="res-group-empty">No reservations this week.</div>';
  futureList.innerHTML = future.length ? future.map(resCardHTML).join('') : '<div class="res-group-empty">No upcoming reservations.</div>';
  weekGroup.style.display='block'; futureGroup.style.display='block';
}
// Resys view containers
function renderResGroups(recs){

      rows+=agRow('t-exp', hold?'On hold':'Experience',
      esc(x.time)+' · '+esc(x.experience)+' · '+esc(x.guest_name||'Guest')+' · 👥'+esc(x.party_size)
        +(x.payment_status==='paid'?' <span class="ag-ok">\u2705</span>':hold?' <span class="ag-tent">\u23f3</span>':''),
      agDetail([['Time', x.time+(x.until?' – '+x.until:'')], ['Tables', x.tables||''],
        ['Status', hold?'Held for an inquiry until '+hu+' — not paid yet':''],
        ['Paid', hold?'':(x.payment_status==='paid'?'Yes':'Not yet')], ['Confirmation', x.code], ['Notes', x.notes]])+expThreadHtml(x)); });
    res.forEach(r=>{ const c=can.includes(r.status); const txt=esc(r.time)+' · '+esc(r.name)+' · 👥'+esc(r.party); rows+=agRow(c?'t-cancel':'t-res', c?'Cancelled':'Reserved', c?'<span class="ag-strike">'+txt+'</span>':txt); });
    sch.forEach(n=>rows+=agRow('t-sched','Schedule',esc(n.name||n),agDetail([
      ['Notes', n.note], ['Through', (n.endDate&&n.endDate!==date)?fmtDisplay(n.endDate):'']
    ])));
    off.forEach(n=>rows+=agRow('t-off','Time Off',esc(n.name||n),agDetail([
      ['Reason', n.note], ['Through', (n.endDate&&n.endDate!==date)?fmtDisplay(n.endDate):'']
    ])));
    html+= only ? rows : '<div class="ag-day'+(date<today?' ag-past':'')+(date===today?' ag-is-today':'')+'"><div class="ag-date">'+dl+(date===today?'<span class="ag-today">Today</span>':'')+'</div>'+rows+'</div>';
  }
  list.innerHTML = any ? html : '<div class="empty"><span class="ic">📅</span>'+(only?'Nothing on the calendar.':'Nothing scheduled this month.')+'</div>';
  if(!only && list.id==='agendaList'){ const t=list.querySelector('.ag-is-today')||[...list.querySelectorAll('.ag-day:not(.ag-past)')][0]; if(t && list.querySelector('.ag-past')) setTimeout(()=>window.scrollTo(0,t.getBoundingClientRect().top+window.scrollY-130),0); }
}

let _todayOff=0, _todaySeq=0;
async function renderToday(){
  const list=document.getElementById('todayList'); if(!list) return;
  const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+_todayOff);
  const date=fmt(d), seq=++_todaySeq;
  document.getElementById('todayLabel').textContent=_todayOff===0?'Today':_todayOff===1?'Tomorrow':_todayOff===-1?'Yesterday':d.toLocaleDateString('en-US',{weekday:'long'});
  document.getElementById('todayDate').textContent=d.toLocaleDateString('en-US',{weekday:_todayOff&&Math.abs(_todayOff)>1?undefined:'long',month:'long',day:'numeric'});
  document.getElementById('todayBtn').classList.toggle('off',_todayOff===0);
  list.innerHTML='<div class="empty"><span class="spin"></span> Loading…</div>';
  const tmp='todayTmp'+seq; const box=document.createElement('div'); box.id=tmp; box.hidden=true; document.body.appendChild(box);
  try{ await renderCalendar({ y:d.getFullYear(), m:d.getMonth(), target:{ list:tmp }, only:date }); }catch(e){}
  if(seq===_todaySeq) list.innerHTML=box.innerHTML;
  box.remove();
}

<!-- HOME-V6 WIDGETS: fills the home tiles with live numbers. Read-only, same public key and the same feeds this page already uses
     (portal-api reservations, the square-orders feed, portal_shifts, cheese_items and Stuff to Know).
     Refreshes every 5 minutes while the home screen is open, and when the app comes back to the front. -->
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  if (!$('dash')) return;
  var CANCEL = ['CANCELLED','CANCELED','DECLINED','NO_SHOW'];
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var PAL = ['#2563eb','#be185d','#047857','#b45309','#7c3aed','#0e7490'];

  function hm(d){ var h=d.getHours(), m=d.getMinutes(), ap=h>=12?'p':'a'; h=(h%12)||12; return h+(m?':'+String(m).padStart(2,'0'):'')+ap; }
  function hmT(t){ if(!t) return ''; var a=String(t).split(':').map(Number), d=new Date(); d.setHours(a[0]||0,a[1]||0,0,0); return hm(d); }
  function money(c){ var d=(c||0)/100; return d>=1000 ? '$'+(d/1000).toFixed(1).replace(/\.0$/,'')+'K' : '$'+Math.round(d).toLocaleString(); }
  function first(n){ return String(n||'').trim().split(/\s+/)[0] || ''; }
  function inits(n){ var p=String(n||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; return (p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
  function dayLbl(ms){ var t=new Date(); t.setHours(0,0,0,0); var x=new Date(ms); x.setHours(0,0,0,0); var n=Math.round((x-t)/864e5);
    return n===0?'Today':n===1?'Tmrw':x.toLocaleDateString('en-US',{weekday:'short'}); }
  function nowHHMM(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function fail(id){ var el=$(id); if(el && /Loading/.test(el.textContent)) el.textContent='Couldn’t load'; }
  // whole numbers count up when they change; anything else is set as text
  // (a background tab never runs animation frames, so a timer always lands the final number)
  function setNum(el, v){
    if(!el) return;
    var to=Number(v), from=Number(el.getAttribute('data-v')), tok=(el._tok=(el._tok||0)+1);
    if(!isFinite(to)){ el.textContent=v; el.removeAttribute('data-v'); return; }
    el.setAttribute('data-v', to);
    function done(){ if(el._tok===tok){ el._tok++; el.textContent=to.toLocaleString(); } }
    if(reduce || document.hidden || to===from){ done(); return; }
    var a=isFinite(from)?from:0, t0=performance.now(), dur=700;
    (function step(now){ if(el._tok!==tok) return; var k=Math.min(1,((now||performance.now())-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=Math.round(a+(to-a)*e).toLocaleString(); if(k<1) requestAnimationFrame(step); else done(); })(t0);
    setTimeout(done, dur+300);
  }

  // ── RESYS: today's bookings, guests, next seating, requests waiting on approval ──
  async function resys(){
    var now=new Date(), s=new Date(now.getFullYear(),now.getMonth(),now.getDate()), e=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59);
    var p=new URLSearchParams(); p.set('paging.limit','100'); p.set('startDateFrom',s.toISOString()); p.set('startDateTo',e.toISOString());
    var q=new URLSearchParams(); q.set('paging.limit','100'); q.set('status','REQUESTED'); q.set('startDateFrom',now.toISOString()); q.set('startDateTo',new Date(now.getTime()+60*864e5).toISOString());
    function get(x){ return wixFetch(x).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); }
    var both=await Promise.all([get(p), get(q)]), a=both[0], b=both[1];
    if(!a){ fail('wgResFoot'); return; }
    var recs=(a.reservations||[]).filter(function(r){ return r.details && r.details.startDate && ((r.reservee||{}).lastName||'')!=='(table hold)'; });
    var booked=recs.filter(function(r){ return CANCEL.indexOf(r.status)<0 && r.status!=='REQUESTED'; });
    var guests=booked.reduce(function(n,r){ return n+(Number(r.details.partySize)||0); },0);
    var up=booked.map(function(r){ return { t:Date.parse(r.details.startDate), r:r }; })
      .filter(function(x){ return x.t>=Date.now()-10*60e3; }).sort(function(x,y){ return x.t-y.t; });
    setNum($('wgResN'), booked.length);
    setNum($('wgResG'), guests);
    $('wgResArt').hidden = booked.length>0;
    $('wgResNext').textContent = up.length ? hm(new Date(up[0].t)) : '—';
    var pend = b ? (b.reservations||[]).filter(function(r){ return r.status==='REQUESTED' && ((r.reservee||{}).lastName||'')!=='(table hold)'; }).length : 0;
    // guests by hour for the hours still ahead (up to five), lighter square = busier
    var byH={};
    booked.forEach(function(r){ var t=Date.parse(r.details.startDate); if(t<Date.now()-60*60e3) return;
      var h=new Date(t).getHours(); byH[h]=(byH[h]||0)+(Number(r.details.partySize)||0); });
    var hrs=Object.keys(byH).map(Number).sort(function(x,y){ return x-y; }).slice(0,5);
    var mx=Math.max.apply(null, hrs.map(function(h){ return byH[h]; }).concat([1]));
    $('wgResHrs').innerHTML = hrs.length ? '<span class="cap">Guests by hour</span><span class="row">'+hrs.map(function(h){
      return '<span class="hr l'+Math.max(1,Math.ceil(4*byH[h]/mx))+'"><b>'+byH[h]+'</b><i>'+((h%12)||12)+(h>=12?'p':'a')+'</i></span>'; }).join('')+'</span>' : '';
    var foot;
    if(pend) foot='<span class="wg-pill"><i class="ti ti-alert-triangle"></i>'+pend+' to approve</span>';
    else if(up.length){ var w=up[0].r.reservee||{}, nm=[w.firstName,w.lastName].filter(Boolean).join(' ')||'Guest';
      foot=esc(nm)+', party of '+esc(up[0].r.details.partySize||'?'); }
    else foot = booked.length ? 'No more seatings today' : 'No bookings yet today';
    $('wgResFoot').innerHTML=foot;
    $('tile-resys').setAttribute('aria-label','Reservations: '+booked.length+' booked today, '+guests+' guests'+(pend?', '+pend+' waiting for approval':''));
  }

  // ── CATERING: the next three orders from the square-orders feed (same feed as the calendar) ──
  async function orders(){
    var t0=new Date(); t0.setHours(0,0,0,0);
    var data=null;
    try{
      var r=await fetch(ORDERS_URL, { method:'POST',
        headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer '+SB_KEY },
        body:JSON.stringify({ action:'feed', from:fmt(t0), to:fmt(new Date(t0.getTime()+7*864e5)), loc:LOC }) });
      if(r.ok) data=await r.json();
    }catch(e){}
    if(!data){ fail('wgCatFoot'); return; }
    var list=(data.orders||[]).filter(function(o){ return o.at && Date.parse(o.at)>=t0.getTime(); })
      .sort(function(a,b){ return Date.parse(a.at)-Date.parse(b.at); });
    var KIND={ catering:'Catering', delivery:'Delivery', pickup:'Pickup', order:'Order' };
    $('wgCatList').innerHTML = list.slice(0,3).map(function(o){ var ms=Date.parse(o.at);
      var due=o.total_cents && !o.paid;
      var sub=[o.total_cents?money(o.total_cents):'', due?'<em>unpaid</em>':(KIND[o.kind]||'Pickup')].filter(Boolean).join(' · ');
      return '<span class="wg-row"><span class="when">'+dayLbl(ms)+'<b>'+hm(new Date(ms))+'</b></span>'
        +'<span class="nm"><b>'+esc(o.name||'Guest')+'</b><small>'+sub+'</small></span></span>';
    }).join('') || '<span class="wg-empty"><i class="ti ti-mood-smile"></i>Nothing booked yet</span><i class="ti ti-tools-kitchen-2 wg-art" aria-hidden="true"></i>';
    var tot=list.reduce(function(n,o){ return n+(o.total_cents||0); },0);
    var unpaid=list.filter(function(o){ return o.total_cents && !o.paid; }).length;
    $('wgCatFoot').innerHTML = list.length
      ? '<b>'+list.length+'</b> order'+(list.length>1?'s':'')+' · '+money(tot)+(unpaid?' · <span class="wg-flag">'+unpaid+' unpaid</span>':'')
      : 'Next 7 days';
  }

  // ── SCHEDULE: who's on today (portal_shifts), my next shift, who's off ──
  var SH=null;
  function kindOf(s){ return (s.kind==='oncall'||s.kind==='off'||s.kind==='offsite') ? s.kind : 'shift'; }
  async function shifts(){
    var grp = LOC==='memphis' ? ['memphis'] : ['nashville','franklin'];
    var t0=new Date(); t0.setHours(0,0,0,0);
    try{
      var r=await Promise.all([
        sb.from('portal_employees').select('id,name,login_id,location').in('location',grp).eq('active',true),
        sb.from('portal_shifts').select('employee_id,date,start_time,end_time,kind,location').in('location',grp)
          .gte('date',fmt(t0)).lte('date',fmt(new Date(t0.getTime()+14*864e5))).order('date').order('start_time')
      ]);
      if(r[0].error || r[1].error) throw new Error('shifts');
      SH={ emps:r[0].data||[], shifts:r[1].data||[] };
    }catch(e){ if(!SH) fail('wgSchFoot'); return; }
    drawSched();
  }
  function drawSched(){
    if(!SH) return;
    var today=fmt(new Date()), byId={};
    SH.emps.forEach(function(e){ byId[e.id]=e; });
    var seen={}, ppl=[];
    SH.shifts.forEach(function(s){ var k=kindOf(s);
      if(s.date!==today || (k!=='shift' && k!=='offsite') || !byId[s.employee_id] || seen[s.employee_id]) return;
      seen[s.employee_id]=1; ppl.push({ e:byId[s.employee_id], s:s }); });
    var fit=Math.max(2, Math.floor((($('wgSchPpl').clientWidth||140)-3)/27)), show=ppl.length>fit ? fit-1 : ppl.length;
    $('wgSchPpl').innerHTML = ppl.length
      ? ppl.slice(0,show).map(function(p){ return '<span class="av" style="background:'+PAL[(Number(p.e.id)||0)%PAL.length]+'" title="'+esc(p.e.name)+'">'+esc(inits(p.e.name))+'</span>'; }).join('')
        + (ppl.length>show ? '<span class="av more">+'+(ppl.length-show)+'</span>' : '')
      : '<span class="av none"><i class="ti ti-users"></i></span><i class="ti ti-calendar-week wg-art" aria-hidden="true"></i>';
    setNum($('wgSchN'), ppl.length);
    $('wgSchN').parentNode.hidden = !SH.shifts.length;
    $('wgSchWho').innerHTML = ppl.length
      ? ppl.slice(0,3).map(function(p){ return esc(first(p.e.name))+' '+hmT(p.s.start_time)+'–'+hmT(p.s.end_time); }).join(' · ')
      : (SH.shifts.length ? 'Nobody on the schedule' : 'No shifts posted yet');
    var foot='', id=(localStorage.getItem('greys_emp_id')||'').trim().toLowerCase(), me=null;
    if(id) SH.emps.forEach(function(e){ if(!me && String(e.login_id||'').trim().toLowerCase()===id) me=e; });
    if(me){
      var t=nowHHMM(), nx=SH.shifts.filter(function(s){ return s.employee_id===me.id && kindOf(s)!=='off'
        && (s.date>today || (s.date===today && String(s.end_time).slice(0,5)>t)); })[0];
      foot = nx ? 'You: <b>'+(nx.date===today?'Today':dayLbl(Date.parse(nx.date+'T12:00:00')))+' '+hmT(nx.start_time)+'–'+hmT(nx.end_time)+'</b>'
                : 'You: no shifts posted';
    }
    if(!foot){
      var off=(typeof approvedTimeOff==='function' ? approvedTimeOff() : []).filter(function(o){ return o.date && o.date<=today && (o.endDate||o.date)>=today; });
      foot = off.length ? '🌴 '+off.map(function(o){ return esc(first(o.name)); }).join(', ')+' off today' : 'Open schedule →';
    }
    $('wgSchFoot').innerHTML=foot;
  }

  // ── CHEESE ENTRY: how many cheeses are in the system, how many this week, the newest ──
  async function cheese(){
    try{
      var wk=new Date(); wk.setHours(0,0,0,0); wk.setDate(wk.getDate()-((wk.getDay()+6)%7));
      var r=await Promise.all([

        sb.from('cheese_items').select('name,created_at').eq('item_kind','cheese').order('created_at',{ ascending:false }).limit(1)

  // ── STUFF TO KNOW: first four titles (re-drawn whenever the page reloads its items) ──
  function stuff(){
    var items=(typeof _info!=='undefined' && _info) ? _info : [];
    var n=$('wgStfN'); n.textContent=items.length; n.hidden=!items.length;
    $('wgStfList').innerHTML = items.slice(0,4).map(function(x){
      return '<span class="wg-row"><i class="ti ti-bookmark"></i><span class="who">'+esc(x.title)+'</span></span>'; }).join('')
      || '<span class="wg-empty"><i class="ti ti-notes"></i>Nothing here yet</span>';
    $('wgStfFoot').textContent = items.length>4 ? '+'+(items.length-4)+' more →' : (items.length ? 'Tap to read →' : 'Managers add these in the console');
  }

  // hook the page's own render functions so the tiles follow the same data
  var _rs=window.renderStuff;
  if(_rs) window.renderStuff=function(){ var r=_rs.apply(this,arguments); try{ stuff(); }catch(e){} return r; };
  var _rsc=window.renderSchedCards;
  if(_rsc) window.renderSchedCards=function(){ var r=_rsc.apply(this,arguments); try{ drawSched(); }catch(e){} return r; };

  var last=0;
  function refresh(){ last=Date.now(); resys(); orders(); shifts(); }
  var _sv=window.showView;
  if(_sv) window.showView=function(name){ var r=_sv.apply(this,arguments); if(name==='home' && Date.now()-last>60e3){ refresh(); } return r; };
  function boot(){ refresh(); cheese(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  setInterval(function(){ if(document.visibilityState==='visible' && $('view-home').classList.contains('active')) refresh(); }, 5*60e3);
  var rz=0; window.addEventListener('resize', function(){ clearTimeout(rz); rz=setTimeout(drawSched, 150); });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && Date.now()-last>2*60e3){ refresh(); cheese(); } });
})();
</script>

<script>

<!-- HISTORY-ROUTER: each section (Specials, Calendar, Events…) becomes a browser history entry (#calendar)
     so Back / the phone back swipe returns to the previous screen instead of leaving the portal. -->
<script>
(function(){
  var current = 'home';
  function hashKey(){ return decodeURIComponent((location.hash || '').slice(1)); }
  function onActive(v){
    var k = v.id.replace(/^view-/, ''); if (k === current) return;
    current = k;
    var h = hashKey();
    if (h === k || (!h && k === 'home')) return;
    if (k === 'home') history.pushState({ view:k }, '', location.pathname + location.search);
    else history.pushState({ view:k }, '', location.pathname + location.search + '#' + k);
  }
  function route(){
    var k = hashKey() || 'home';
    if (k === current || !document.getElementById('view-' + k) || !window.showView) return;
    showView(k);
  }
  function boot(){
    var vs = document.querySelectorAll('.view');
    var mo = new MutationObserver(function(recs){
      for (var i = 0; i < recs.length; i++){ var v = recs[i].target; if (v.classList.contains('active')) { onActive(v); return; } }
    });
    Array.prototype.forEach.call(vs, function(v){ mo.observe(v, { attributes:true, attributeFilter:['class'] }); });
    window.addEventListener('popstate', route);
    window.addEventListener('hashchange', route);
    if (hashKey()) route();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
