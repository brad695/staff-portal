services:
  - type: web
    name: greys-staff-portal
    runtime: static
    branch: main
    # No build step — static index.html + manager.html that talk directly to
    # Supabase (DB) and the Supabase Edge Function (Wix proxy). No server to boot.
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    # Clean URLs: /manager serves manager.html (pages strip ".html" from the address bar themselves).
    routes:
      - type: rewrite
        source: /manager
        destination: /manager.html
      - type: rewrite
        source: /order
        destination: /order.html
      - type: rewrite
        source: /schedule
        destination: /schedule.html
      - type: rewrite
        source: /labels
        destination: /labels.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  # STAGING copy of the portal — builds branch `staging`. Same live Supabase DB.
  # Red STAGING bar is added client-side by hostname (see STAGING-BAR in each page).
  - type: web
    name: greys-staff-portal-staging
    runtime: static
    branch: staging
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    # Clean URLs: /manager serves manager.html (pages strip ".html" from the address bar themselves).
    routes:
      - type: rewrite
        source: /manager
        destination: /manager.html
      - type: rewrite
        source: /order
        destination: /order.html
      - type: rewrite
        source: /schedule
        destination: /schedule.html
      - type: rewrite
        source: /labels
        destination: /labels.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /calendar
        destination: /calendar.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Robots-Tag
        value: noindex
