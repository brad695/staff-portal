<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>card harness</title>
<link rel="stylesheet" href="/tools/cheese-cards/fonts.css">
</head><body>
<script src="/studio/js/util.js"></script>
<script src="/studio/js/fonts.js"></script>
<script src="/studio/js/shapes.js"></script>
<script src="/studio/js/render.js"></script>
<script src="/studio/js/templates.js"></script>
<script src="/studio/js/cards.js"></script>
<script>
// The layout rules live in /studio/js/cards.js (shared with Cheese Entry in manager.html); this page only loads the
// brand fonts from local @fontsource files (font-display: block, no Google) and hands build.js the same four calls as before.
(function () {
  const GS = window.GS, C = GS.Cards;
  window.fontsReady = (async () => {
    for (const f of C.FACES) await document.fonts.load(f, C.SAMPLE);
    const ok = C.FACES.map((f) => document.fonts.check(f, 'Aa'));
    GS.bus.emit('fontsloaded');
    return ok;
  })();
  window.buildCard = function (c, idx, baseMs, kind) {
    const r = C.build(c, kind || 'cheese');
    r.d.createdAt = baseMs - idx * 1000;
    return r;
  };
  window.prep = C.prep;
  window.thumbOf = C.thumb;
  window.pngOf = C.png;
})();
</script>
</body></html>
