<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>size guide harness</title>
<link rel="stylesheet" href="/tools/size-guide/fonts.css">
</head><body>
<script src="/studio/js/util.js"></script>
<script src="/studio/js/fonts.js"></script>
<script src="/studio/js/shapes.js"></script>
<script src="/studio/js/render.js"></script>
<script src="/studio/js/templates.js"></script>
<script>
(function () {
  const GS = window.GS, R = GS.R;
  GS.Store = GS.Store || { resolveURL: async (ref) => ref }; // pictures are plain /studio/graphics/ paths
  const FACES = ['600 40px "Barlow Condensed"', '700 40px "Barlow Condensed"'];
  window.fontsReady = (async () => {
    for (const f of FACES) await document.fonts.load(f, 'AaBbXx0123456789 ×');
    const ok = FACES.map((f) => document.fonts.check(f, 'Aa'));
    GS.bus.emit('fontsloaded');
    return ok;
  })();

  // spec.json (from make_graphics.py) -> a Studio design. Temp keys: _fit (shrink a text box to its words),
  // _after/_x1 (a rule that starts 16 px after a heading), _cy (center a label on its dimension line).
  window.buildDesign = function (spec, meta) {
    const els = spec.els.map((o) => GS.mk[o.type](Object.assign({}, o)));
    const byId = new Map(els.map((e) => [e.id, e]));
    for (const e of els) {
      if (e.type !== 'text') continue;
      R.syncText(e);
      if (e._fit) { const L = R.textLayout(e); e.w = Math.ceil(Math.max(...L.lines.map((l) => l.w)) + 2); R.syncText(e); }
    }
    for (const e of els) {
      if (e._after) { const t = byId.get(e._after); const x = t.x + t.w + 14; e.w = Math.round((e._x1 - x) * 100) / 100; e.x = Math.round(x * 100) / 100; }
      if (e._cy != null) e.y = Math.round((e._cy - e.h / 2) * 100) / 100;
      delete e._fit; delete e._after; delete e._x1; delete e._cy;
    }
    return { id: meta.id, name: meta.name, w: spec.w, h: spec.h, unit: 'px', kind: 'custom', createdAt: meta.createdAt,
      pages: [{ id: meta.pageId, bg: { color: spec.bg }, els }] };
  };
  window.prep = async function (d) {
    await R.preload(d);
    const bad = d.pages[0].els.filter((e) => e.type === 'image' && R.imgState(e.src) !== 'ok').map((e) => e.src);
    if (bad.length) throw new Error('picture did not load: ' + [...new Set(bad)].join(', '));
  };
  window.thumbOf = function (d) {
    const s = Math.min(280 / d.w, 280 / d.h);
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(d.w * s)); cv.height = Math.max(1, Math.round(d.h * s));
    const ctx = cv.getContext('2d');
    ctx.setTransform(s, 0, 0, s, 0, 0);
    R.drawPage(ctx, d, d.pages[0], { scale: s });
    return cv.toDataURL('image/jpeg', 0.74);
  };
  window.pngOf = function (d, s) {
    const cv = document.createElement('canvas');
    cv.width = Math.round(d.w * s); cv.height = Math.round(d.h * s);
    const ctx = cv.getContext('2d');
    ctx.setTransform(s, 0, 0, s, 0, 0);
    R.drawPage(ctx, d, d.pages[0], { scale: s, exporting: true });
    return cv.toDataURL('image/png');
  };
})();
</script>
</body></html>
